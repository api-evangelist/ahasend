provider: AhaSend
providerId: ahasend
scheme: api-key-scopes
oauth2: false
scheme_note: >-
  IMPORTANT — these are NOT OAuth 2.0 scopes. AhaSend declares a single `BearerAuth` HTTP bearer
  scheme in its OpenAPI and no oauth2 flow anywhere. What it does publish is a granular
  authorization model attached to each API key, and the OpenAPI carries those role names as the
  VALUES of its per-operation security requirements — the contract's own words: "Non-empty
  Security Requirement values are AhaSend API-key roles. Roles listed within one requirement
  object are jointly required; separate requirement objects are alternatives." The file is filed
  under scopes/ because that is what the model is; the label OAuthScopes on the apis.yml pointer
  is the catalog's canonical string, not a claim that AhaSend runs OAuth.
oidc:
  supported: true
  role: relying-party
  note: >-
    AhaSend supports OpenID Connect SSO (with PKCE and multi-domain support) for DASHBOARD login
    on the Max plan. It consumes a customer's identity provider; it does not issue OAuth tokens
    for its API.
  docs: https://ahasend.com/docs/security/sso.md
scope_kinds:
  - kind: static
    description: Fixed account-level permissions, e.g. accounts:read, domains:write.
  - kind: global
    description: Ends with :all, covering every domain in the account, e.g. messages:send:all.
  - kind: domain-specific
    description: Restricted to one domain, e.g. messages:send:{example.com}.
  - kind: wildcard
    value: '*'
    description: Grants everything. AhaSend advises using it only for development and testing.
