enforcement_notes:
  - >-
    Scopes are enforced per operation and, for domain-scoped keys, per resource — a route or
    webhook is authorized against the domain it belongs to, not just against the caller.
  - >-
    Sub-account API keys are managed only with PARENT credentials holding the relevant
    sub-account-api-keys:* scope. A sub account's own credentials cannot create or manage its
    nested keys.
  - >-
    Scopes compose with IP allow lists: a key outside its allow list is rejected on every
    endpoint regardless of the scopes it holds.
  - >-
    A scope failure and an IP-allow-list failure both return HTTP 403 with a free-text message
    and no machine-distinguishable marker.
