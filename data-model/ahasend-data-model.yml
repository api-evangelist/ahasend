scoping_pattern: >-
  Every operation except `ping` is nested under /v2/accounts/{account_id}/…, so the Account is the
  tenancy boundary for the whole API. Sub accounts extend that one level: a parent's key reaches a
  sub account's resources only through the /sub-accounts/ path, never by passing the sub account's
  id as {account_id}.
