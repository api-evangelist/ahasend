provider: AhaSend
providerId: ahasend
description: >-
  AhaSend's event surface. AhaSend publishes NO AsyncAPI document; it publishes a second OpenAPI
  3.1 document dedicated to its webhooks, using the 3.1 top-level `webhooks` object. That document
  is saved verbatim beside this file as asyncapi/ahasend-webhooks-openapi.yaml, and this manifest
  is the readable catalog of what it contains.
spec:
  type: OpenAPI 3.1 webhooks document
  asyncapi: false
  title: AhaSend Webhooks
  version: 2.0.0
  file: asyncapi/ahasend-webhooks-openapi.yaml
  remote: https://ahasend.com/docs/webhooks.yaml
  event_count: 11
transport: HTTPS POST to a subscriber-configured URL
content_type: application/json
management_api: openapi/ahasend-webhooks-api-openapi.yml
security:
  standard: Standard Webhooks
  spec_url: https://github.com/standard-webhooks/standard-webhooks/blob/main/spec/standard-webhooks.md
  headers:
    webhook-id: Unique event identifier; AhaSend recommends using it as the consumer's idempotency key.
    webhook-timestamp: Unix timestamp of the send; reject deliveries outside your tolerance window in either direction.
    webhook-signature: HMAC-SHA256 over `id.timestamp.body`.
  key_handling_caveat: >-
    The HMAC key is the LITERAL UTF-8 bytes of the webhook secret, including its prefix. Standard
    Webhooks libraries that Base64-decode the secret in their default constructor derive a
    different key and reject valid AhaSend deliveries — use raw-key mode (Go `NewWebhookRaw`,
    JavaScript `new Webhook(secret, { format: "raw" })`).
  verify_against: raw request body bytes, before JSON parsing
delivery:
  success_criteria: any 2xx from the subscriber endpoint
  retries: 6 attempts over 16+ minutes
  backoff: 'unsuccessful attempts ^ 4, with randomized ±10% jitter'
  auto_disable: >-
    After 100 consecutive failures the webhook is disabled automatically and every account member
    is notified by email.
  duplicate_semantics: >-
    Events can be retried, so handlers must be idempotent — AhaSend publishes a guide on exactly
    this failure mode (https://ahasend.com/blog/why-your-webhook-fired-twice-handling-duplicate-events/).
scoping:
  scope_values: [global, scoped]
  note: >-
    A scoped webhook requires a non-empty `domains` array and write permission on every listed
    domain; a global webhook requires webhooks:write:all and returns `domains: []`.
