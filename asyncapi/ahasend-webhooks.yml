  - name: message.routing
    group: Route Events
    summary: Inbound Message Route Event
    payload_schema: RouteWebhookPayload
    note: >-
      Inbound routing rather than outbound delivery — the parsed inbound message (latest reply
      separated from quoted text and signature, attachments and headers included) POSTed to the
      route's URL. Signed the same way; its own retry policy is documented separately. Attachments
      carry a `disposition` field distinguishing a real attachment from an inline embedded image.
testing:
  sandbox: >-
    Sandbox mode fires every event normally, and `sandbox_result` (deliver/bounce/defer/fail/
    suppress) selects which ones fire — a complete event pipeline can be exercised without
    sending mail.
  local: >-
    The CLI streams live webhook and inbound-route events to localhost over WebSocket, so no
    public endpoint is needed during development.
gap: >-
  No AsyncAPI document. The webhook contract is machine-readable, but as an OpenAPI 3.1 `webhooks`
  object, which most event-oriented tooling does not read.
