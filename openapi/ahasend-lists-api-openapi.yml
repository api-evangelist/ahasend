openapi: 3.2.0
info:
  title: AhaSend API v2 Lists API
  description: 'The AhaSend API v2 allows you to send transactional emails, manage domains, webhooks, routes, API keys, and view statistics. ## Authentication

    All API requests must be authenticated using a Bearer token in the Authorization header:

    ```

    Authorization: Bearer aha-sk-64-CHARACTER-RANDOM-STRING

    ```


    ## Scopes

    API keys have specific scopes that control access to different resources and actions:


    ### Message Scopes

    - `messages:send:all` - Send messages from any domain in the account

    - `messages:send:{domain}` - Send messages from a specific domain

    - `messages:cancel:all` - Cancel messages from any domain

    - `messages:cancel:{domain}` - Cancel messages from a specific domain

    - `messages:read:all` - Read messages from any domain

    - `messages:read:{domain}` - Read messages from a specific domain


    ### Domain Scopes

    - `domains:read` - Read all domains

    - `domains:write` - Create and update domains

    - `domains:delete:all` - Delete any domain

    - `domains:delete:{domain}` - Delete a specific domain


    ### Account Scopes

    - `accounts:read` - Read account information

    - `accounts:write` - Update account settings

    - `accounts:billing` - Access billing information

    - `accounts:members:read` - Read account members

    - `accounts:members:add` - Add account members

    - `accounts:members:update` - Update account members

    - `accounts:members:remove` - Remove account members


    ### Webhook Scopes

    - `webhooks:read:all` - Read all webhooks

    - `webhooks:read:{domain}` - Read webhooks for a specific domain

    - `webhooks:write:all` - Create and update webhooks

    - `webhooks:write:{domain}` - Create and update webhooks for a specific domain

    - `webhooks:delete:all` - Delete any webhook

    - `webhooks:delete:{domain}` - Delete webhooks for a specific domain


    ### Route Scopes

    - `routes:read:all` - Read all routes

    - `routes:read:{domain}` - Read routes for a specific domain

    - `routes:write:all` - Create and update routes

    - `routes:write:{domain}` - Create and update routes for a specific domain

    - `routes:delete:all` - Delete any route

    - `routes:delete:{domain}` - Delete routes for a specific domain


    ### Suppression Scopes

    - `suppressions:read` - Read suppressions

    - `suppressions:write` - Create suppressions

    - `suppressions:delete` - Delete suppressions

    - `suppressions:wipe` - Delete the account''s suppressions except protected ones (dangerous)


    ### Template Scopes

    - `templates:read` - Read transactional templates, their drafts and their published versions, and campaign templates

    - `templates:write` - Create and update transactional templates, and publish, discard and restore their drafts; create and update campaign templates

    - `templates:delete` - Delete transactional templates and campaign templates


    ### Campaign Scopes

    - `campaigns:read` - Read campaigns, their stats and their recipients

    - `campaigns:write` - Create, update and duplicate campaigns

    - `campaigns:delete` - Delete draft campaigns

    - `campaigns:send` - Send, unschedule and test-send campaigns


    ### Contact Scopes

    - `contacts:read` - Read contacts

    - `contacts:write` - Create and update contacts

    - `contacts:delete` - Delete contacts


    ### Contact lifecycle and attributes

    Contacts are account-global. A contact created through this API joins no

    list on its own; campaigns target lists, so add it to one with the Lists

    endpoints before a campaign can reach it. Contact subscription state and suppression records are independent:

    creating, updating, unsubscribing, resubscribing, or deleting a contact

    never creates, changes, or removes complaint, permanent, or protected

    suppressions. Prefer unsubscribe over delete when the goal is only to stop

    marketing mail, because unsubscribe is reversible and preserves contact

    history. Writable attribute keys and types come from the account''s contact-attribute

    definitions managed in the dashboard; this API does not expose property

    definition CRUD.'
  version: 2.0.0
  contact:
    email: support@ahasend.com
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://api.ahasend.com
  description: Production server
security:
- BearerAuth: []
tags:
- name: Lists
  description: Manage contact lists and the contacts on them
paths:
  /v2/accounts/{account_id}/lists:
    get:
      summary: List Lists
      description: 'Returns the account''s lists in newest-first `(created_at, id)` order.

        `after` and `before` are mutually exclusive. Every list carries

        `contact_count`, the number of members a campaign to it would reach.'
      operationId: getLists
      tags:
      - Lists
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: Maximum number of lists to return
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: after
        in: query
        description: Cursor for the next page; cannot be combined with `before`
        schema:
          type: string
      - name: before
        in: query
        description: Cursor for the previous page; cannot be combined with `after`
        schema:
          type: string
      - name: name
        in: query
        description: 'Case-insensitive substring match on the list name. `%`, `_`, and `\`

          match literally rather than as wildcards. The value is trimmed

          before it is matched, so one that is empty or all whitespace filters

          nothing and the full collection is returned.

          '
        schema:
          type: string
      security:
      - BearerAuth:
        - lists:read
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  response, _, err := client.ListsAPI.GetLists(ctx, accountID, requests.GetListsParams{\n    Limit: ahasend.Int32(100),\n    Name:  ahasend.String(\"newsletter\"),\n  })\n  if err != nil {\n    log.Fatalf(\"Error listing lists: %v\", err)\n  }\n  for _, list := range response.Data {\n    fmt.Printf(\"%s %s (%d contacts)\\n\", list.ID, list.Name, list.ContactCount)\n  }\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: 'import { AhaSendClient } from "@ahasend/sdk";


          const client = AhaSendClient.fromEnv();

          const page = await client.lists.list({ name: "newsletter", limit: 20 });

          console.log("Lists listed.", { count: page.data.length });

          '
      responses:
        '200':
          description: Paginated lists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContactListsResponse'
        '400':
          description: Invalid filter or cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing `lists:read` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create List
      description: 'Creates one list. Lists are static, private, and single opt-in, and

        names are not unique within an account. A new list has no members, so

        its `contact_count` is 0.


        The optional `Idempotency-Key` follows the ordinary 24-hour v2 replay

        contract. An identical request replays the same status and semantically

        equivalent JSON body with `Idempotent-Replayed: true`. Reusing the key

        with a different method, resolved path, or semantic JSON payload

        returns 422.'
      operationId: createList
      tags:
      - Lists
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - BearerAuth:
        - lists:write
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  // The SDK sends a fresh Idempotency-Key with this POST and reuses it on\n  // its own retries, so a retried request is not applied twice.\n  response, _, err := client.ListsAPI.CreateList(ctx, accountID, requests.CreateListRequest{\n    Name:        \"Product updates\",\n    Description: ahasend.String(\"Monthly release notes\"),\n    Tags:        []string{\"product\"},\n  })\n  if err != nil {\n    log.Fatalf(\"Error creating list: %v\", err)\n  }\n  fmt.Printf(\"Created list %s\\n\", response.ID)\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: "import { AhaSendClient } from \"@ahasend/sdk\";\n\nconst client = AhaSendClient.fromEnv();\n// The SDK sends a fresh Idempotency-Key automatically and reuses it on its own retries.\nconst list = await client.lists.create({\n  name: \"Product updates\",\n  description: \"Monthly release notes\",\n  tags: [\"product\"],\n});\nconsole.log(\"List created.\", { id: list.id, contactCount: list.contact_count });\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactListRequest'
      responses:
        '201':
          description: List created successfully
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactList'
        '400':
          description: 'Invalid request body, or a property that is not writable. An

            identical keyed retry replays the stored response with

            `Idempotent-Replayed: true`.

            '
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing `lists:write` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/IdempotencyPayloadMismatch'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/accounts/{account_id}/lists/{list_id}:
    get:
      summary: Get List
      description: Returns one account-scoped list, including `contact_count`.
      operationId: getList
      tags:
      - Lists
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: list_id
        in: path
        required: true
        description: List ID
        schema:
          type: string
          format: uuid
      security:
      - BearerAuth:
        - lists:read
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  listID := uuid.MustParse(\"11111111-1111-4111-8111-111111111111\")\n\n  response, _, err := client.ListsAPI.GetList(ctx, accountID, listID)\n  if err != nil {\n    log.Fatalf(\"Error getting list: %v\", err)\n  }\n  fmt.Printf(\"%s (%d contacts)\\n\", response.Name, response.ContactCount)\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: 'import { AhaSendClient } from "@ahasend/sdk";


          const client = AhaSendClient.fromEnv();

          const listId = "00000000-0000-4000-8000-000000000010";

          const list = await client.lists.get(listId);

          console.log("List found.", { id: list.id, contactCount: list.contact_count });

          '
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactList'
        '400':
          description: Malformed `list_id`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing `lists:read` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: List not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update List
      description: 'Partially updates one account-scoped list. An omitted or null property

        leaves the stored value unchanged; a present `tags` array replaces the

        stored tags, and an empty one clears them. A stored value that breaks a

        bound this API introduces reads back fine and fails only when it is

        re-sent here.'
      operationId: updateList
      tags:
      - Lists
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: list_id
        in: path
        required: true
        description: List ID
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContactListRequest'
      security:
      - BearerAuth:
        - lists:write
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  listID := uuid.MustParse(\"11111111-1111-4111-8111-111111111111\")\n\n  // Only the fields you set change; an empty tags slice clears the tags.\n  response, _, err := client.ListsAPI.UpdateList(ctx, accountID, listID, requests.UpdateListRequest{\n    Name: ahasend.String(\"Product updates\"),\n    Tags: &[]string{},\n  })\n  if err != nil {\n    log.Fatalf(\"Error updating list: %v\", err)\n  }\n  fmt.Printf(\"Updated list %s\\n\", response.Name)\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: 'import { AhaSendClient } from "@ahasend/sdk";


          const client = AhaSendClient.fromEnv();

          const listId = "00000000-0000-4000-8000-000000000010";

          const list = await client.lists.update(listId, { name: "Product news", tags: [] });

          console.log("List updated.", { id: list.id, name: list.name });

          '
      responses:
        '200':
          description: Updated list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactList'
        '400':
          description: Malformed `list_id`, invalid request body, or a property that is not writable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing `lists:write` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: List not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete List
      description: 'Soft-deletes one account-scoped list. The list stops being readable and

        stops contributing recipients to any campaign, but every membership row

        is kept, so deleting a list never discards the record that someone

        unsubscribed from it or reported it as spam. Those memberships stop

        being readable with the list: this list answers 404 afterwards, and it

        no longer appears among a contact''s lists.


        Deleting a list that is already gone returns 404, so a client retrying

        to convergence converges.'
      operationId: deleteList
      tags:
      - Lists
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: list_id
        in: path
        required: true
        description: List ID
        schema:
          type: string
          format: uuid
      security:
      - BearerAuth:
        - lists:delete
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  listID := uuid.MustParse(\"11111111-1111-4111-8111-111111111111\")\n\n  response, _, err := client.ListsAPI.DeleteList(ctx, accountID, listID)\n  if err != nil {\n    log.Fatalf(\"Error deleting list: %v\", err)\n  }\n  fmt.Println(response.Message)\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: 'import { AhaSendClient } from "@ahasend/sdk";


          const client = AhaSendClient.fromEnv();

          const listId = "00000000-0000-4000-8000-000000000010";

          const result = await client.lists.delete(listId);

          console.log("List deleted.", { message: result.message });

          '
      responses:
        '200':
          description: List deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Malformed `list_id`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing `lists:delete` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: List not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'A campaign that still needs this list references it. Campaigns

            in `draft`, `validating`, `scheduled`, `sending`,

            `paused`, or `waiting_for_review` block the delete, while `sent`,

            `failed`, and `canceled` campaigns do not. This conflict carries no

            idempotency headers.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/accounts/{account_id}/lists/{list_id}/contacts:
    get:
      summary: List Contacts on a List
      description: 'Returns one list''s members, newest first on the membership''s own

        `(created_at, id)`. Each item carries the membership, its `contact_id`,

        and the contact''s normalized email; `include_contacts=true` embeds the

        whole contact and additionally requires the `contacts:read` scope.

        `after` and `before` are mutually exclusive.


        `subscription_status=confirmed` answers who a campaign on this list can

        reach, subject to the account-wide checks campaign initialization also

        applies. The filter accepts `complained` as well, because such a

        membership exists and must be findable even though no caller can write

        that status.'
      operationId: getListContacts
      tags:
      - Lists
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: list_id
        in: path
        required: true
        description: List ID
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: Maximum number of memberships to return
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: after
        in: query
        description: Cursor for the next page; cannot be combined with `before`
        schema:
          type: string
      - name: before
        in: query
        description: Cursor for the previous page; cannot be combined with `after`
        schema:
          type: string
      - name: subscription_status
        in: query
        description: Per-list consent filter
        schema:
          type: string
          enum:
          - unconfirmed
          - confirmed
          - unsubscribed
          - complained
      - name: email
        in: query
        description: 'Exact email filter. The value is normalized before it is

          compared, so one that is empty or all whitespace filters nothing

          and the full collection is returned. It is compared against the

          address as stored, so an address that was stored unnormalized

          renders normalized in this collection and is still not matched by

          this filter.

          '
        schema:
          type: string
          format: email
      - name: include_contacts
        in: query
        description: 'Embed the whole contact in every item. Requires the `contacts:read`

          scope in addition to `lists:read`.

          '
        schema:
          type: boolean
      security:
      - BearerAuth:
        - lists:read
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  listID := uuid.MustParse(\"11111111-1111-4111-8111-111111111111\")\n\n  response, _, err := client.ListsAPI.GetListContacts(ctx, accountID, listID, requests.GetListContactsParams{\n    SubscriptionStatus: ahasend.String(requests.ListContactStatusConfirmed),\n  })\n  if err != nil {\n    log.Fatalf(\"Error listing list contacts: %v\", err)\n  }\n  for _, member := range response.Data {\n    fmt.Printf(\"%s %s\\n\", member.Email, member.SubscriptionStatus)\n  }\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: "import { AhaSendClient } from \"@ahasend/sdk\";\n\nconst client = AhaSendClient.fromEnv();\nconst listId = \"00000000-0000-4000-8000-000000000010\";\nconst page = await client.lists.contacts.list(listId, {\n  subscription_status: \"confirmed\",\n  limit: 20,\n});\nconsole.log(\"List members listed.\", { count: page.data.length });\n"
      responses:
        '200':
          description: Paginated list memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedListContactsResponse'
        '400':
          description: Malformed `list_id`, invalid filter, or invalid cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Missing `lists:read` scope, or `include_contacts=true` without the

            `contacts:read` scope. The expansion check runs before the list is

            resolved, so an unauthorized expansion naming a list that does not

            exist answers 403 rather than 404.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: List not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
