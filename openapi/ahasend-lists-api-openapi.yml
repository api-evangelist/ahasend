          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/accounts/{account_id}/lists/{list_id}/contacts/batch:
    post:
      summary: Batch add contacts to a list
      description: 'Synchronously adds one through 1,000 existing contacts to one list.

        This operation only ever inserts: an entry whose membership already

        exists is reported `already_member` and the stored row is left exactly

        as it stands, whatever its status, so bulk work can never erase an

        unsubscribe. A membership it creates is `confirmed`. No contact is

        created, and an entry naming nobody in this account is reported

        `not_found`.


        One malformed entry does not cost the others their result. An entry is

        reported `invalid` when it is not an object, names neither or both of

        `email` and `id`, carries any other property, holds an `id` that is

        not a string or not a UUID, or an `email` that is not a string or fails

        the validation contact writes apply, or repeats an identifier another

        entry already used. Duplicates are

        counted on the normalized identifier, so `A@x.com` and `a@x.com` are

        one identifier and both entries fail. A contact named twice by

        different kinds of identifier is settled by payload order: the earliest

        position that would create the membership takes `added`, and every

        later one takes `already_member`. An unknown property beside `data` is

        still a 400 for the whole request.


        The memberships and the optional idempotency replay response commit

        atomically and use the ordinary 24-hour replay window. Every status

        this operation''s handler produces is stored and replayable: the 200,

        the 404 for a list that is not there, and each of the 400s below.

        Reusing a key with a different method, resolved path, or semantic JSON

        payload returns 422. An identical keyed request replays the same status

        and a semantically equivalent JSON response.


        Measured pacing guidance: batch size is a cap, not a throughput target.

        Measure end-to-end latency with representative data, submit the next

        synchronous batch only after the previous response, and reduce batch

        size or pace requests when latency grows. Honor 429 responses before

        continuing; the API makes no fixed throughput guarantee.'
      operationId: batchAddListContacts
      tags:
      - Lists
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: list_id
        in: path
        required: true
        description: List ID
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - BearerAuth:
        - lists:write
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/AhaSend/ahasend-go/models/responses\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  listID := uuid.MustParse(\"11111111-1111-4111-8111-111111111111\")\n\n  // Name each contact by email or by ID.\n  contactID := uuid.MustParse(\"22222222-2222-4222-8222-222222222222\")\n  // The SDK sends a fresh Idempotency-Key with this POST and reuses it on\n  // its own retries, so a retried request is not applied twice.\n  response, _, err := client.ListsAPI.BatchAddListContacts(ctx, accountID, listID, requests.BatchAddListContactsRequest{\n    Data: []requests.BatchAddListContactInput{\n      {Email: ahasend.String(\"one@example.com\")},\n      {ID: &contactID},\n    },\n  })\n  if err != nil {\n    log.Fatalf(\"Error adding contacts to the list: %v\", err)\n  }\n  // Each item succeeds or fails on its own.\n  fmt.Printf(\"added=%d skipped=%d failed=%d\\n\", response.Added, response.Skipped, response.Failed)\n  for _, result := range response.Data {\n    if result.Outcome != responses.BatchListContactOutcomeAdded {\n      fmt.Printf(\"item %d: %s %s\\n\", result.Position, result.Outcome, result.Reason)\n    }\n  }\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: "import { AhaSendClient } from \"@ahasend/sdk\";\n\nconst client = AhaSendClient.fromEnv();\nconst listId = \"00000000-0000-4000-8000-000000000010\";\n// The SDK sends a fresh Idempotency-Key automatically and reuses it on its own retries.\nconst result = await client.lists.contacts.batchAdd(listId, {\n  data: [{ email: \"one@example.com\" }, { id: \"00000000-0000-4000-8000-000000000011\" }],\n});\nconsole.log(\"List batch completed.\", { added: result.added, failed: result.failed });\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchAddListContactsRequest'
      responses:
        '200':
          description: Ordered per-entry outcomes
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAddListContactsResponse'
        '400':
          description: 'A malformed `list_id`, a body that is not a single JSON object, an

            unknown property beside `data`, a `data` that is absent, null or not

            an array, an empty `data` array, or more than 1,000 entries. An

            identical keyed retry replays the stored response with

            `Idempotent-Replayed: true`.

            '
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing `lists:write` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'List not found. The handler produces this status, so it is stored

            against the idempotency key: an identical keyed retry replays it

            with `Idempotent-Replayed: true` rather than looking the list up

            again.

            '
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/IdempotencyPayloadMismatch'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/accounts/{account_id}/lists/{list_id}/contacts/{id_or_email}:
    put:
      summary: Add or Update a List Contact
      description: 'Adds one existing contact to one list, or updates the membership that

        is already there, and returns the membership either way. No contact is

        created.


        A membership this call creates is `confirmed` unless the body names

        another status. On a membership that already exists, a body naming no

        status leaves the stored status exactly as it is: a PUT is not an

        implicit resubscribe, and naming a status is the deliberate act that

        may resubscribe. A write that names the status the membership already

        holds changes nothing at all, `updated_at` included, so a retry leaves

        the row identical.


        `confirmed` sets `subscribed_at` and clears `unsubscribed_at`;

        `unsubscribed` sets `unsubscribed_at` and leaves `subscribed_at` as it

        was; `unconfirmed` sets neither.


        UUID-shaped path values resolve by ID; all other values resolve by

        trimmed, lowercased email. Email identifiers must be percent-encoded

        exactly once as URL path segments; pass a raw email to SDKs, including

        addresses such as `user+tag@example.com`.'
      operationId: upsertListContact
      tags:
      - Lists
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: list_id
        in: path
        required: true
        description: List ID
        schema:
          type: string
          format: uuid
      - name: id_or_email
        in: path
        required: true
        description: 'Contact UUID or email address. Percent-encode an email exactly once

          as a path segment; SDK callers pass the raw email value.

          '
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertListContactRequest'
      security:
      - BearerAuth:
        - lists:write
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  listID := uuid.MustParse(\"11111111-1111-4111-8111-111111111111\")\n\n  // Record that the contact unsubscribed from this list. Setting confirmed\n  // would subscribe them again, so only do that when they asked for it.\n  response, _, err := client.ListsAPI.UpsertListContact(ctx, accountID, listID, \"user+tag@example.com\", requests.UpsertListContactRequest{\n    SubscriptionStatus: ahasend.String(requests.ListContactStatusUnsubscribed),\n  })\n  if err != nil {\n    log.Fatalf(\"Error updating the list membership: %v\", err)\n  }\n  fmt.Printf(\"%s is %s\\n\", response.Email, response.SubscriptionStatus)\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: "import { AhaSendClient } from \"@ahasend/sdk\";\n\nconst client = AhaSendClient.fromEnv();\nconst listId = \"00000000-0000-4000-8000-000000000010\";\nconst idOrEmail = \"User+Tag@Example.COM\";\nconst membership = await client.lists.contacts.upsert(listId, idOrEmail, {\n  subscription_status: \"unsubscribed\",\n});\nconsole.log(\"List membership saved.\", { status: membership.subscription_status });\n"
      responses:
        '200':
          description: The membership, whether this request created it or updated one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListContact'
        '400':
          description: 'Malformed `list_id`, an absent or non-object body, a property that

            is not writable, or a `subscription_status` outside `confirmed`,

            `unconfirmed`, and `unsubscribed`. The body is validated before the

            membership is read, so naming `complained` is 400 whatever the

            stored row holds.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing `lists:write` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'The list does not exist on this account, or no contact matches

            `{id_or_email}`. The message says which.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'The membership is `complained`: the contact reported this list as

            spam, that verdict is the mailbox provider''s rather than the

            caller''s, and writing over it would clear the only record of when

            the complaint landed. The membership is frozen and nothing is

            changed, including by a request naming no status. This conflict

            carries no idempotency headers.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Remove a Contact from a List
      description: 'Removes one contact from one list. UUID-shaped path values resolve by

        ID; all other values resolve by trimmed, lowercased email. Email

        identifiers must be percent-encoded exactly once as URL path segments;

        pass a raw email to SDKs, including addresses such as

        `user+tag@example.com`.


        This deletes the membership row, and with it any record that the

        contact unsubscribed from this list, so re-adding them later is silent.

        Prefer unsubscribe over delete when the intent is only to prevent

        marketing delivery: `PUT` the same path with

        `{"subscription_status": "unsubscribed"}` instead, which is reversible

        and keeps the record. A `complained` membership, one whose contact

        reported the list as spam, cannot be removed and returns 409, so the

        contact cannot be added back as `confirmed`. Removing a membership that

        is not there returns 404.'
      operationId: deleteListContact
      tags:
      - Lists
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: list_id
        in: path
        required: true
        description: List ID
        schema:
          type: string
          format: uuid
      - name: id_or_email
        in: path
        required: true
        description: 'Contact UUID or email address. Percent-encode an email exactly once

          as a path segment; SDK callers pass the raw email value.

          '
        schema:
          type: string
      security:
      - BearerAuth:
        - lists:write
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  listID := uuid.MustParse(\"11111111-1111-4111-8111-111111111111\")\n\n  // Removing drops the membership. To stop sending to the contact while\n  // keeping the record, set its status to unsubscribed instead.\n  response, _, err := client.ListsAPI.DeleteListContact(ctx, accountID, listID, \"user+tag@example.com\")\n  if err != nil {\n    log.Fatalf(\"Error removing the contact from the list: %v\", err)\n  }\n  fmt.Println(response.Message)\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: 'import { AhaSendClient } from "@ahasend/sdk";


          const client = AhaSendClient.fromEnv();

          const listId = "00000000-0000-4000-8000-000000000010";

          const idOrEmail = "User+Tag@Example.COM";

          const result = await client.lists.contacts.delete(listId, idOrEmail);

          console.log("Contact removed from list.", { message: result.message });

          '
      responses:
        '200':
          description: Contact removed from the list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Malformed `list_id`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing `lists:write` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'The list does not exist on this account, no contact matches

            `{id_or_email}`, or the contact is not on this list. The message

            says which.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The contact reported this list as spam; the membership is kept
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/accounts/{account_id}/contacts/{id_or_email}/lists:
    get:
      summary: List a Contact's Lists
      description: 'Returns the lists one contact is on, newest first on the membership''s

        own `(created_at, id)`. Each item carries the membership with the list

        embedded, and soft-deleted lists are excluded. This is the reverse of

        `GET /v2/accounts/{account_id}/lists/{list_id}/contacts`, and the only

        way to answer what one person is subscribed to without walking every

        list. `after` and `before` are mutually exclusive.


        UUID-shaped path values resolve by ID; all other values resolve by

        trimmed, lowercased email. Email identifiers must be percent-encoded

        exactly once as URL path segments; pass a raw email to SDKs, including

        addresses such as `user+tag@example.com`.


        To stop marketing mail to someone everywhere at once, `PUT

        /v2/accounts/{account_id}/contacts/{id_or_email}` with

        `{"unsubscribed": true}`; there is no remove-from-all-lists operation.

        That is an account-wide verdict campaigns honour, and it does not

        change any membership here: every row still reads back with the status

        it holds, though the contact no longer counts toward any list''s

        `contact_count`. To record the decision on one list, `PUT` that

        membership with `{"subscription_status": "unsubscribed"}`.'
      operationId: getContactLists
      tags:
      - Lists
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: id_or_email
        in: path
        required: true
        description: 'Contact UUID or email address. Percent-encode an email exactly once

          as a path segment; SDK callers pass the raw email value.

          '
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of memberships to return
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: after
        in: query
        description: Cursor for the next page; cannot be combined with `before`
        schema:
          type: string
      - name: before
        in: query
        description: Cursor for the previous page; cannot be combined with `after`
        schema:
          type: string
      - name: subscription_status
        in: query
        description: Per-list consent filter
        schema:
          type: string
          enum:
          - unconfirmed
          - confirmed
          - unsubscribed
          - complained
      security:
      - BearerAuth:
        - lists:read
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  response, _, err := client.ListsAPI.GetContactLists(ctx, accountID, \"user+tag@example.com\", requests.GetContactListsParams{\n    SubscriptionStatus: ahasend.String(requests.ListContactStatusConfirmed),\n  })\n  if err != nil {\n    log.Fatalf(\"Error getting the contact's lists: %v\", err)\n  }\n  for _, membership := range response.Data {\n    if membership.List != nil {\n      fmt.Printf(\"%s %s\\n\", membership.List.Name, membership.SubscriptionStatus)\n    }\n  }\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: 'import { AhaSendClient } from "@ahasend/sdk";


          const client = AhaSendClient.fromEnv();

          const idOrEmail = "User+Tag@Example.COM";

          const page = await client.contacts.lists.list(idOrEmail, { subscription_status: "confirmed" });

          console.log("Contact lists listed.", { count: page.data.length });

          '
      responses:
        '200':
          description: Paginated list memberships, each with its list embedded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedListContactsResponse'
        '400':
          description: Invalid filter or cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing `lists:read` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  responses:
    IdempotencyConflict:
      description: 'Request in progress. This response always includes

        `Idempotent-Replayed: false` and a positive integer `Retry-After`.

        Clients must use that header tuple, not the human-readable message, to

        distinguish this retryable idempotency state from other HTTP 409s.

        '
      headers:
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotencyInProgress'
        Retry-After:
          $ref: '#/components/headers/IdempotencyRetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: A request with this idempotency key is already in progress
    IdempotencyPayloadMismatch:
      description: 'Idempotency key was already used with a different HTTP method, resolved

        request path, or request body. This response includes neither

        `Idempotent-Replayed` nor `Retry-After`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: idempotency key was already used with a different request payload
  schemas:
    JSONValue:
      description: Any recursively nested JSON value stored in a contact attribute
      oneOf:
      - type: 'null'
      - type: boolean
      - type: number
      - type: string
      - type: array
        items:
          $ref: '#/components/schemas/JSONValue'
      - type: object
        additionalProperties:
          $ref: '#/components/schemas/JSONValue'
    ListContact:
      type: object
      additionalProperties: false
      description: 'One contact''s membership of one list. It carries no id of its own: a

        membership is addressed by the `(list_id, contact_id)` pair.

        '
      required:
      - object
      - list_id
      - contact_id
      - email
      - subscription_status
      - subscribed_at
      - unsubscribed_at
      - created_at
      - updated_at
      properties:
        object:
          type: string
          enum:
          - list_contact
          description: Object type identifier
        list_id:
          type: string
          format: uuid
          description: The list this membership is on
        contact_id:
          type: string
          format: uuid
          description: The contact this membership belongs to
        email:
          type: string
          format: email
          description: The contact's normalized email address
        subscription_status:
          type: string
          enum:
          - unconfirmed
          - confirmed
          - unsubscribed
          - complained
          description: 'Per-list consent, independent of the contact''s account-wide

            `unsubscribed` flag. `complained` is the mailbox provider''s verdict

            and is never writable.

            '
        subscribed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When consent was given. Set when the membership becomes

            `confirmed` and left alone afterwards, so it records when consent

            was given rather than when it was last re-asserted.

            '
        unsubscribed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the membership became `unsubscribed`, or when the complaint

            landed for a `complained` membership. Cleared when the membership

            becomes `confirmed` again.

            '
        created_at:
          type: string
          format: date-time
          description: When the membership was created
        updated_at:
          type: string
          format: date-time
          description: When the membership was last updated
        contact:
          $ref: '#/components/schemas/Contact'
          description: 'The whole contact. Present only on `GET

            /v2/accounts/{account_id}/lists/{list_id}/contacts` with

            `include_contacts=true`.

            '
        list:
          $ref: '#/components/schemas/EmbeddedContactList'
          description: 'The list this membership is on. Present only on `GET

            /v2/accounts/{account_id}/contacts/{id_or_email}/lists`.

            '
    BatchListContactResult:
      type: object
      additionalProperties: false
      description: 'One entry''s outcome. `position` is the entry''s index in the request

        array and the only handle an entry that named no single identifier

        carries.

        '
      required:
      - position
      - outcome
      properties:
        position:
          type: integer
          minimum: 0
        email:
          type: string
          description: 'The normalized input email, echoed only when the entry named one

            identifier and it decoded to a non-empty string. An entry whose

            `email` was not a string or was empty once trimmed, and one naming

            both identifiers, carry `position` alone.

            '
        id:
          type: string
          format: uuid
          description: 'The input contact ID, echoed only when the entry named one that

            parsed as a UUID.

            '
        outcome:
          type: string
          enum:
          - added
          - already_member
          - not_found
          - invalid
          description: '`added` created the membership, `already_member` found one and left

            it untouched whatever its status, `not_found` matched no contact in

            this account, and `invalid` was decidable from the payload alone.

            '
        membership:
          $ref: '#/components/schemas/ListContact'
          description: 'The membership, present on `added` and on `already_member`, where

            it is the row as it stands.

            '
        reason:
          type: string
          description: Caller-safe reason present only on `not_found` and `invalid`
    SuccessResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          description: Success message
      example:
        message: Operation completed successfully
    EmbeddedContactList:
      type: object
      additionalProperties: false
      description: 'The list as a membership carries it: a `contact_list` without

        `contact_count`, which no membership read pays for.

        '
      required:
      - object
      - id
      - created_at
      - updated_at
      - name
      - description
      - tags
      properties:
        object:
          type: string
          enum:
          - contact_list
          description: Object type identifier
        id:
          type: string
          format: uuid
          description: Unique identifier for the list
        created_at:
          type: string
          format: date-time
          description: When the list was created
        updated_at:
          type: string
          format: date-time
          description: When the list was last updated
        name:
          type: string
          description: List name; names are not unique within an account
        description:
          type: string
          description: Free-text description; empty when none was given
        tags:
          type: array
          description: Always present; an empty array when the list carries no tags
          items:
            type: string
    BatchAddListContactInput:
      type: object
      description: 'Names exactly one of `email` or `id`; a null names neither. No contact

        is created here.


        None of that is a request-level rejection, which is why it is stated

        here rather than constrained above: an entry that names neither

        identifier, names both, or carries any other property is reported

        `invalid` at its own position inside a 200, and one naming nobody in

        this account is reported `not_found`.

        '
      properties:
        email:
          type:
          - string
          - 'null'
          format: email
          description: Contact email; trimmed and lowercased before duplicates are counted
        id:
          type:
          - string
          - 'null'
          format: uuid
          description: Contact ID
    PaginatedContactListsResponse:
      type: object
      additionalProperties: false
      required:
      - object
      - data
      - pagination
      properties:
        object:
          type: string
          enum:
          - list
        data:
          type: array
          items:
            $ref: '#/components/schemas/ContactList'
        pagination:
          $ref: '#/components/schemas/ContactPagination'
    ContactPagination:
      type: object
      additionalProperties: false
      required:
      - has_more
      - next_cursor
      - previous_cursor
      properties:
        has_more:
          type: boolean
          description: Whether another page exists in the requested direction
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as `after` to fetch the next page
        previous_cursor:
          type:
          - string
          - 'null'
          description: Pass as `before` to fetch the previous page
    UpdateContactListRequest:
      type: object
      additionalProperties: false
      description: 'A partial list update. An omitted or null property leaves the stored

        value unchanged; a present `tags` array replaces the stored tags, and an

        empty one clears them. A property that is not writable is rejected with

        400 naming it.

        '
      properties:
        name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          description: 'Trimmed before it is measured and stored, exactly as on create. The

            bound counts characters rather than bytes, and a name that is empty

            after trimming is rejected.

            '
        description:
          type:
          - string
          - 'null'
          maxLength: 1000
          description: Trimmed and bounded exactly as on create.
        tags:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Normalized and bounded exactly as on create.
    UpsertListContactRequest:
      type: object
      additionalProperties: false
      description: 'Names at most `subscription_status`. An empty object is legal and names

        no status: on a new membership that means `confirmed`, and on one that

        already exists it leaves the stored status exactly as it is. A property

        that is not writable is rejected with 400 naming it.

        '
      properties:
        subscription_status:
          type:
          - string
          - 'null'
          enum:
          - confirmed
          - unconfirmed
          - unsubscribed
          - null
          description: 'Null and omission are one case and name no status. `complained` is

            the mailbox provider''s verdict rather than the caller''s and is

            rejected with 400.

            '
    PaginatedListContactsResponse:
      type: object
      additionalProperties: false
      required:
      - object
      - data
      - pagination
      properties:
        object:
          type: string
          enum:
          - list
        data:
          type: array
          items:
            $ref: '#/components/schemas/ListContact'
        pagination:
          $ref: '#/components/schemas/ContactPagination'
    Contact:
      type: object
      additionalProperties: false
      description: 'Public contact projection. Attribute reads are legacy-safe: values can

        contain null, booleans, numbers, strings, arrays, or nested objects even

        though new writes accept only canonical dashboard-defined values.

        '
      required:
      - object
      - id
      - created_at
      - updated_at
      - email
      - first_name
      - last_name
      - status
      - status_reason
      - unsubscribed
      - unsubscribed_at
      - attributes
      - validation_status
      - last_validated_at
      properties:
        object:
          type: string
          enum:
          - contact
          description: Object type identifier
        id:
          type: string
          format: uuid
          description: Unique identifier for the contact
        created_at:
          type: string
          format: date-time
          description: When the contact was created
        updated_at:
          type: string
          format: date-time
          description: When the contact was last updated
        email:
          type: string
          format: email
          description: Normalized contact email address
        first_name:
          type: string
        last_name:
          type: string
        status:
          type: string
          enum:
          - enabled
          - disabled
          - blocked
        status_reason:
          type: string
        unsubscribed:
          type: boolean
        unsubscribed_at:
          type:
          - string
          - 'null'
          format: date-time
        attributes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/JSONValue'
        validation_status:
          type: string
          enum:
          - unvalidated
          - valid
          - invalid
          - risky
          - unknown
        last_validated_at:
          type:
          - string
          - 'null'
          format: date-time
    BatchAddListContactsRequest:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/BatchAddListContactInput'
    CreateContactListRequest:
      type: object
      additionalProperties: false
      description: 'The writable list projection. A property that is not writable is

        rejected with 400 naming it.

        '
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: 'Trimmed before it is measured and stored. The bound counts

            characters rather than bytes, and a name that is empty after

            trimming is rejected.

            '
        description:
          type:
          - string
          - 'null'
          maxLength: 1000
          description: 'Trimmed before it is measured and stored. The bound counts

            characters rather than bytes. Null and omission both store an empty

            description.

            '
        tags:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'Each tag is trimmed, empty tags are dropped, and duplicates are

            collapsed; at most 50 tags may survive that normalization. A null

            element is rejected rather than read as an empty string. Null and

            omission both store an empty array.

            '
    ContactList:
      type: object
      additionalProperties: false
      description: 'A static, private, single opt-in container of contacts, and the unit a

        campaign targets.

        '
      required:
      - object
      - id
      - created_at
      - updated_at
      - name
      - description
      - tags
      - contact_count
      properties:
        object:
          type: string
          enum:
          - contact_list
          description: Object type identifier
        id:
          type: string
          format: uuid
          description: Unique identifier for the list
        created_at:
          type: string
          format: date-time
          description: When the list was created
        updated_at:
          type: string
          format: date-time
          description: When the list was last updated
        name:
          type: string
          description: List name; names are not unique within an account
        description:
          type: string
          description: Free-text description; empty when none was given
        tags:
          type: array
          description: Always present; an empty array when the list carries no tags
          items:
            type: string
        contact_count:
          type: integer
          minimum: 0
          description: 'The list''s subscribers: the members a campaign to this list would

            reach. A member counts when its membership is `confirmed` and the

            contact is enabled, not unsubscribed from everything, and not found

            invalid by validation. It is the same number the dashboard shows.

            '
    BatchAddListContactsResponse:
      type: object
      additionalProperties: false
      required:
      - object
      - added
      - skipped
      - failed
      - data
      properties:
        object:
          type: string
          enum:
          - list
        added:
          type: integer
          minimum: 0
          description: Entries whose membership this request created
        skipped:
          type: integer
          minimum: 0
          description: Entries reported `already_member`
        failed:
          type: integer
          minimum: 0
          description: Entries reported `not_found` or `invalid`
        data:
          type: array
          items:
            $ref: '#/components/schemas/BatchListContactResult'
    ErrorResponse:
      type: object
      description: 'Human-readable API error. The server currently sends no stable machine

        error code. In particular, clients must not parse `message` to

        distinguish IP-allow-list, scope, ownership, plan, self-lockout,

        suppression-duplicate, or other errors that share an HTTP status.

        '
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
          description: Error description
      example:
        message: Error message
  headers:
    IdempotentReplayed:
      description: 'Indicates that this response is a stored replay of a previous identical request.

        When this header is absent, the response is not a stored replay. Ordinary fresh

        responses do not send `false`; that value is reserved for an in-progress 409.

        '
      schema:
        type: string
        enum:
        - 'true'
    IdempotencyInProgress:
      description: 'Identifies an idempotency-key execution that is still in progress. This

        header is emitted only on the specialized HTTP 409 response.

        '
      schema:
        type: string
        enum:
        - 'false'
    IdempotencyRetryAfter:
      description: 'Positive whole number of seconds after which the in-progress execution

        lease may be retried with the same key and unchanged request.

        '
      schema:
        type: integer
        minimum: 1
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Optional idempotency key for safe request retries. Must be a unique string for each logical request.

        An identical request with a completed stored outcome returns the original status and body. An in-progress

        execution returns 409, a changed method/path/body returns 422, and a released 5xx execution may run again.

        Keys for non-secret responses expire after 24 hours. API-key create responses include a one-time `secret_key`,

        so successful encrypted replay responses for those operations expire after 5 minutes.

        '
      schema:
        type: string
        maxLength: 255
      example: user-12345-create-domain-20240101
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: aha-sk-64-CHARACTER-RANDOM-STRING
      description: 'API key for authentication. Non-empty Security Requirement values are

        AhaSend API-key roles. Roles listed within one requirement object are

        jointly required; separate requirement objects are alternatives.

        '
