components:
  schemas:
    Bounce:
      type: object
      properties:
        classification:
          type: string
          description: Bounce classification
          example: example_value
        count:
          type: integer
          description: Number of bounces
          example: 1
      required:
      - classification
      - count
    ErrorResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          description: Error description
          example: example_value
      example:
        message: Error message
    BounceStatisticsResponse:
      type: object
      required:
      - object
      - data
      properties:
        object:
          type: string
          enum:
          - list
          description: Object type identifier
          example: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/BounceStatistics'
          description: Array of bounce statistics
          example:
          - from_timestamp: '2025-03-15T14:30:00Z'
            to_timestamp: '2025-03-15T14:30:00Z'
            bounces:
            - {}
    DeliveryTimeStatisticsResponse:
      type: object
      required:
      - object
      - data
      properties:
        object:
          type: string
          enum:
          - list
          description: Object type identifier
          example: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryTimeStatistics'
          description: Array of delivery time statistics
          example:
          - from_timestamp: '2025-03-15T14:30:00Z'
            to_timestamp: '2025-03-15T14:30:00Z'
            avg_delivery_time: 1.0
            delivered_count: 1
            delivery_times:
            - {}
    DeliverabilityStatistics:
      type: object
      properties:
        from_timestamp:
          type: string
          format: date-time
          description: Start time of the statistics bucket
          example: '2025-03-15T14:30:00Z'
        to_timestamp:
          type: string
          format: date-time
          description: End time of the statistics bucket
          example: '2025-03-15T14:30:00Z'
        reception_count:
          type: integer
          description: Number of messages accepted for delivery
          example: 1
        delivered_count:
          type: integer
          description: Number of messages delivered
          example: 1
        deferred_count:
          type: integer
          description: Number of messages deferred
          example: 1
        bounced_count:
          type: integer
          description: Number of messages bounced
          example: 1
        failed_count:
          type: integer
          description: Number of messages failed
          example: 1
        suppressed_count:
          type: integer
          description: Number of messages suppressed
          example: 1
        opened_count:
          type: integer
          description: Number of messages opened at least once
          example: 1
        clicked_count:
          type: integer
          description: Number of messages that have at least one link in them clicked.
          example: 1
      required:
      - from_timestamp
      - to_timestamp
    DeliverabilityStatisticsResponse:
      type: object
      required:
      - object
      - data
      properties:
        object:
          type: string
          enum:
          - list
          description: Object type identifier
          example: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/DeliverabilityStatistics'
          description: Array of deliverability statistics
          example:
          - from_timestamp: '2025-03-15T14:30:00Z'
            to_timestamp: '2025-03-15T14:30:00Z'
            reception_count: 1
            delivered_count: 1
            deferred_count: 1
    BounceStatistics:
      type: object
      properties:
        from_timestamp:
          type: string
          format: date-time
          description: Start time of the statistics bucket
          example: '2025-03-15T14:30:00Z'
        to_timestamp:
          type: string
          format: date-time
          description: End time of the statistics bucket
          example: '2025-03-15T14:30:00Z'
        bounces:
          type: array
          items:
            $ref: '#/components/schemas/Bounce'
          description: Bounce count per bounce classification
          example:
          - classification: example_value
            count: 1
      required:
      - from_timestamp
      - to_timestamp
      - bounces
    DeliveryTimeStatistics:
      type: object
      properties:
        from_timestamp:
          type: string
          format: date-time
          description: Start time of the statistics bucket
          example: '2025-03-15T14:30:00Z'
        to_timestamp:
          type: string
          format: date-time
          description: End time of the statistics bucket
          example: '2025-03-15T14:30:00Z'
        avg_delivery_time:
          type: number
          format: double
          description: Average delivery time in seconds
          example: 1.0
        delivered_count:
          type: integer
          description: Number of messages
          example: 1
        delivery_times:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryTime'
            description: Delivery times per recipient domain
          example:
          - recipient_domain: mail.example.com
            delivery_time: 1.0
      required:
      - from_timestamp
      - to_timestamp
      - avg_delivery_time
      - delivered_count
    DeliveryTime:
      type: object
      properties:
        recipient_domain:
          type: string
          format: fqdn
          description: The recipient domain
          example: mail.example.com
        delivery_time:
          type: number
          format: double
          description: The average time from reception to delivery in seconds
          example: 1.0
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: aha-sk-64-CHARACTER-RANDOM-STRING
      description: API key for authentication
