                  x-microcks-default: true
                  value:
                    message: example_value
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                getWebhooks401Example:
                  summary: Default getWebhooks 401 response
                  x-microcks-default: true
                  value:
                    message: example_value
        '403':
          description: Forbidden
