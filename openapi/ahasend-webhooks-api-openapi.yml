openapi: 3.2.0
info:
  title: AhaSend API v2 Webhooks API
  description: 'The AhaSend API v2 allows you to send transactional emails, manage domains, webhooks, routes, API keys, and view statistics. ## Authentication

    All API requests must be authenticated using a Bearer token in the Authorization header:

    ```

    Authorization: Bearer aha-sk-64-CHARACTER-RANDOM-STRING

    ```


    ## Scopes

    API keys have specific scopes that control access to different resources and actions:


    ### Message Scopes

    - `messages:send:all` - Send messages from any domain in the account

    - `messages:send:{domain}` - Send messages from a specific domain

    - `messages:cancel:all` - Cancel messages from any domain

    - `messages:cancel:{domain}` - Cancel messages from a specific domain

    - `messages:read:all` - Read messages from any domain

    - `messages:read:{domain}` - Read messages from a specific domain


    ### Domain Scopes

    - `domains:read` - Read all domains

    - `domains:write` - Create and update domains

    - `domains:delete:all` - Delete any domain

    - `domains:delete:{domain}` - Delete a specific domain


    ### Account Scopes

    - `accounts:read` - Read account information

    - `accounts:write` - Update account settings

    - `accounts:billing` - Access billing information

    - `accounts:members:read` - Read account members

    - `accounts:members:add` - Add account members

    - `accounts:members:update` - Update account members

    - `accounts:members:remove` - Remove account members


    ### Webhook Scopes

    - `webhooks:read:all` - Read all webhooks

    - `webhooks:read:{domain}` - Read webhooks for a specific domain

    - `webhooks:write:all` - Create and update webhooks

    - `webhooks:write:{domain}` - Create and update webhooks for a specific domain

    - `webhooks:delete:all` - Delete any webhook

    - `webhooks:delete:{domain}` - Delete webhooks for a specific domain


    ### Route Scopes

    - `routes:read:all` - Read all routes

    - `routes:read:{domain}` - Read routes for a specific domain

    - `routes:write:all` - Create and update routes

    - `routes:write:{domain}` - Create and update routes for a specific domain

    - `routes:delete:all` - Delete any route

    - `routes:delete:{domain}` - Delete routes for a specific domain


    ### Suppression Scopes

    - `suppressions:read` - Read suppressions

    - `suppressions:write` - Create suppressions

    - `suppressions:delete` - Delete suppressions

    - `suppressions:wipe` - Delete the account''s suppressions except protected ones (dangerous)


    ### Template Scopes

    - `templates:read` - Read transactional templates, their drafts and their published versions, and campaign templates

    - `templates:write` - Create and update transactional templates, and publish, discard and restore their drafts; create and update campaign templates

    - `templates:delete` - Delete transactional templates and campaign templates


    ### Campaign Scopes

    - `campaigns:read` - Read campaigns, their stats and their recipients

    - `campaigns:write` - Create, update and duplicate campaigns

    - `campaigns:delete` - Delete draft campaigns

    - `campaigns:send` - Send, unschedule and test-send campaigns


    ### Contact Scopes

    - `contacts:read` - Read contacts

    - `contacts:write` - Create and update contacts

    - `contacts:delete` - Delete contacts


    ### Contact lifecycle and attributes

    Contacts are account-global. A contact created through this API joins no

    list on its own; campaigns target lists, so add it to one with the Lists

    endpoints before a campaign can reach it. Contact subscription state and suppression records are independent:

    creating, updating, unsubscribing, resubscribing, or deleting a contact

    never creates, changes, or removes complaint, permanent, or protected

    suppressions. Prefer unsubscribe over delete when the goal is only to stop

    marketing mail, because unsubscribe is reversible and preserves contact

    history. Writable attribute keys and types come from the account''s contact-attribute

    definitions managed in the dashboard; this API does not expose property

    definition CRUD.'
  version: 2.0.0
  contact:
    email: support@ahasend.com
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://api.ahasend.com
  description: Production server
security:
- BearerAuth: []
tags:
- name: Webhooks
  description: Manage webhook notifications
paths:
  /v2/accounts/{account_id}/webhooks:
    get:
      summary: Get Webhooks
      description: 'Returns a list of webhooks for the account


        The global read role sees all webhooks. Domain-scoped read roles return

        only webhooks associated with at least one authorized domain.


        **Query Parameters:**

        - `enabled`: Filter by enabled status

        - Event filters: `on_reception`, `on_delivered`, `on_transient_error`, `on_failed`, `on_bounced`, `on_suppressed`, `on_opened`, `on_clicked`, `on_suppression_created`, `on_dns_error`

        - `limit`: Maximum number of items to return (1-100, default: 100)

        - `after`: Pagination cursor for the next page

        - `before`: Pagination cursor for the previous page'
      operationId: getWebhooks
      tags:
      - Webhooks
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: enabled
        in: query
        description: Filter by enabled status
        schema:
          type: boolean
      - name: on_reception
        in: query
        description: Filter by reception event trigger
        schema:
          type: boolean
      - name: on_delivered
        in: query
        description: Filter by delivery event trigger
        schema:
          type: boolean
      - name: on_transient_error
        in: query
        description: Filter by transient error event trigger
        schema:
          type: boolean
      - name: on_failed
        in: query
        description: Filter by failure event trigger
        schema:
          type: boolean
      - name: on_bounced
        in: query
        description: Filter by bounce event trigger
        schema:
          type: boolean
      - name: on_suppressed
        in: query
        description: Filter by suppression event trigger
        schema:
          type: boolean
      - name: on_opened
        in: query
        description: Filter by open event trigger
        schema:
          type: boolean
      - name: on_clicked
        in: query
        description: Filter by click event trigger
        schema:
          type: boolean
      - name: on_suppression_created
        in: query
        description: Filter by suppression creation event trigger
        schema:
          type: boolean
      - name: on_dns_error
        in: query
        description: Filter by DNS error event trigger
        schema:
          type: boolean
      - name: limit
        in: query
        description: Maximum number of items to return (1-100)
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: after
        in: query
        description: Pagination cursor for the next page. Provide the value provided in `next_cursor` from the response.
        schema:
          type: string
      - name: before
        in: query
        description: Pagination cursor for the previous page.
        schema:
          type: string
      security:
      - BearerAuth:
        - webhooks:read:all
      - BearerAuth:
        - webhooks:read:{domain}
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  params := api.GetWebhooksParams{Enabled: ahasend.Bool(true)}\n  params.Limit = ahasend.Int32(100)\n\n  response, _, err := client.WebhooksAPI.GetWebhooks(ctx, accountID, params)\n  if err != nil {\n    log.Fatalf(\"Error getting webhooks: %v\", err)\n  }\n  for _, webhook := range response.Data {\n    fmt.Printf(\"%s %s -> %s\\n\", webhook.ID, webhook.Name, webhook.URL)\n  }\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: 'import { AhaSendClient } from "@ahasend/sdk";


          const client = AhaSendClient.fromEnv();

          const page = await client.webhooks.list({ limit: 20 });

          console.log("Webhooks listed.", { count: page.data.length });

          '
      responses:
        '200':
          description: List of webhooks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWebhooksResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create Webhook
      description: 'Creates a new webhook for event notifications. A `scoped` webhook

        requires at least one domain and the key must have write permission for

        every supplied domain. A `global` webhook requires

        `webhooks:write:all`; supplied domains are accepted but ignored, and

        the response contains `domains: []`.'
      operationId: createWebhook
      tags:
      - Webhooks
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - BearerAuth:
        - webhooks:write:all
      - BearerAuth:
        - webhooks:write:{domain}
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  // The SDK sends a fresh Idempotency-Key with this POST and reuses it on\n  // its own retries, so a retried request is not applied twice.\n  response, _, err := client.WebhooksAPI.CreateWebhook(ctx, accountID, requests.CreateWebhookRequest{\n    Name:             \"Failures\",\n    URL:              \"https://example.com/webhook\",\n    Scope:            \"global\",\n    Enabled:          ahasend.Bool(true),\n    OnBounced:        true,\n    OnTransientError: true,\n    OnFailed:         true,\n  })\n  if err != nil {\n    log.Fatalf(\"Error creating webhook: %v\", err)\n  }\n  // Use the secret to verify the signature of each delivery.\n  fmt.Printf(\"Created webhook %s, secret: %s\\n\", response.ID, response.Secret)\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: "import { AhaSendClient } from \"@ahasend/sdk\";\n\nconst client = AhaSendClient.fromEnv();\n// The SDK sends a fresh Idempotency-Key automatically and reuses it on its own retries.\nconst webhook = await client.webhooks.create({\n  name: \"Delivery events\",\n  url: \"https://example.com/webhooks/ahasend\",\n  scope: \"global\",\n  on_delivered: true,\n});\nconsole.log(\"Webhook created.\", { id: webhook.id, name: webhook.name });\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: Webhook created successfully
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedWebhook'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/IdempotencyPayloadMismatch'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/accounts/{account_id}/webhooks/{webhook_id}:
    get:
      summary: Get Webhook
      description: 'Returns a specific webhook by ID. Access requires the global read role

        or a read role matching at least one associated domain.'
      operationId: getWebhook
      tags:
      - Webhooks
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: webhook_id
        in: path
        required: true
        description: Webhook ID
        schema:
          type: string
          format: uuid
      security:
      - BearerAuth:
        - webhooks:read:all
      - BearerAuth:
        - webhooks:read:{domain}
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  webhookID := uuid.MustParse(\"c5a32c40-b351-439f-8230-779daed3e42c\")\n\n  response, _, err := client.WebhooksAPI.GetWebhook(ctx, accountID, webhookID)\n  if err != nil {\n    log.Fatalf(\"Error getting webhook: %v\", err)\n  }\n  fmt.Printf(\"%s -> %s (enabled: %t)\\n\", response.Name, response.URL, response.Enabled)\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: 'import { AhaSendClient } from "@ahasend/sdk";


          const client = AhaSendClient.fromEnv();

          const webhookId = "00000000-0000-4000-8000-000000000007";

          const webhook = await client.webhooks.get(webhookId);

          console.log("Webhook found.", { id: webhook.id, name: webhook.name });

          '
      responses:
        '200':
          description: Webhook details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update Webhook
      description: 'Updates an existing webhook. Omitted or null fields are unchanged.

        Omitted/null `domains` preserves associations, while `[]` clears the

        associations of a resulting-scoped webhook. Moving from global to

        scoped requires a non-empty `domains` array in the same request. Moving

        to global clears associations and ignores supplied domains.


        A domain-scoped key must be authorized for the existing webhook and

        every newly supplied domain; changing to global requires

        `webhooks:write:all`.


        **Note:** The webhook secret is not updatable'
      operationId: updateWebhook
      tags:
      - Webhooks
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: webhook_id
        in: path
        required: true
        description: Webhook ID
        schema:
          type: string
          format: uuid
      security:
      - BearerAuth:
        - webhooks:write:all
      - BearerAuth:
        - webhooks:write:{domain}
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  webhookID := uuid.MustParse(\"c5a32c40-b351-439f-8230-779daed3e42c\")\n\n  response, _, err := client.WebhooksAPI.UpdateWebhook(ctx, accountID, webhookID, requests.UpdateWebhookRequest{\n    Name:      ahasend.String(\"Failures\"),\n    URL:       ahasend.String(\"https://example.com/webhook\"),\n    Enabled:   ahasend.Bool(true),\n    OnBounced: ahasend.Bool(true),\n  })\n  if err != nil {\n    log.Fatalf(\"Error updating webhook: %v\", err)\n  }\n  fmt.Printf(\"Updated webhook %s\\n\", response.ID)\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: "import { AhaSendClient } from \"@ahasend/sdk\";\n\nconst client = AhaSendClient.fromEnv();\nconst webhookId = \"00000000-0000-4000-8000-000000000007\";\nconst webhook = await client.webhooks.update(webhookId, {\n  name: \"Transactional delivery events\",\n});\nconsole.log(\"Webhook updated.\", { id: webhook.id, name: webhook.name });\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookRequest'
      responses:
        '200':
          description: Webhook updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete Webhook
      description: 'Deletes a webhook. Access requires the global delete role or a delete

        role matching at least one associated domain.'
      operationId: deleteWebhook
      tags:
      - Webhooks
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: webhook_id
        in: path
        required: true
        description: Webhook ID
        schema:
          type: string
          format: uuid
      security:
      - BearerAuth:
        - webhooks:delete:all
      - BearerAuth:
        - webhooks:delete:{domain}
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  webhookID := uuid.MustParse(\"c5a32c40-b351-439f-8230-779daed3e42c\")\n\n  response, _, err := client.WebhooksAPI.DeleteWebhook(ctx, accountID, webhookID)\n  if err != nil {\n    log.Fatalf(\"Error deleting webhook: %v\", err)\n  }\n  fmt.Println(response.Message)\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: 'import { AhaSendClient } from "@ahasend/sdk";


          const client = AhaSendClient.fromEnv();

          const webhookId = "00000000-0000-4000-8000-000000000007";

          const result = await client.webhooks.delete(webhookId);

          console.log("Webhook deleted.", { message: result.message });

          '
      responses:
        '200':
          description: Webhook deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Webhook:
      type: object
      properties:
        object:
          type: string
          enum:
          - webhook
          description: Object type identifier
        id:
          type: string
          format: uuid
          description: Unique identifier for the webhook
        created_at:
          type: string
          format: date-time
          description: When the webhook was created
        updated_at:
          type: string
          format: date-time
          description: When the webhook was last updated
        name:
          type: string
          description: Webhook name
        url:
          type: string
          format: uri
          description: Webhook URL
        enabled:
          type: boolean
          description: Whether the webhook is enabled
        on_reception:
          type: boolean
          description: Trigger on message reception
        on_delivered:
          type: boolean
          description: Trigger on message delivery
        on_transient_error:
          type: boolean
          description: Trigger on transient errors
        on_failed:
          type: boolean
          description: Trigger on permanent failures
        on_bounced:
          type: boolean
          description: Trigger on bounces
        on_suppressed:
          type: boolean
          description: Trigger on suppressions
        on_opened:
          type: boolean
          description: Trigger on opens
        on_clicked:
          type: boolean
          description: Trigger on clicks
        on_suppression_created:
          type: boolean
          description: Trigger on suppression creation
        on_dns_error:
          type: boolean
          description: Trigger on DNS errors
        scope:
          type: string
          enum:
          - global
          - scoped
          description: Webhook scope
        domains:
          type: array
          items:
            type: string
          description: Domains this webhook applies to. Always present; global webhooks return an empty array.
        success_count:
          type: integer
          minimum: 0
          description: Number of successful calls
        error_count:
          type: integer
          minimum: 0
          description: Number of unsuccessful calls
        errors_since_last_success:
          type: integer
          minimum: 0
          description: 'Number of consecutive failed calls. Reset to zero by the next

            successful call.

            '
        last_request_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the webhook was last called
      required:
      - object
      - id
      - created_at
      - updated_at
      - name
      - url
      - enabled
      - on_reception
      - on_delivered
      - on_transient_error
      - on_failed
      - on_bounced
      - on_suppressed
      - on_opened
      - on_clicked
      - on_suppression_created
      - on_dns_error
      - scope
      - domains
      - success_count
      - error_count
      - errors_since_last_success
      - last_request_at
    CreatedWebhook:
      allOf:
      - $ref: '#/components/schemas/Webhook'
      - type: object
        properties:
          secret:
            type: string
            description: Webhook signing secret. Returned only when the webhook is created.
        required:
        - secret
    PaginationInfo:
      type: object
      required:
      - has_more
      properties:
        has_more:
          type: boolean
          description: Whether more items exist after the last item of this page
        next_cursor:
          type: string
          description: Pass as `after` to fetch the next page
        previous_cursor:
