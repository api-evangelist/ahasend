      - dns_records
      - last_dns_check_at
      - dns_valid
      - tracking_subdomain
      - return_path_subdomain
      - subscription_subdomain
      - media_subdomain
      - dkim_rotation_interval_days
      - dkim_selector
      - rotation_ready
      - dsn_recipient
      - sending_type
      - paused
