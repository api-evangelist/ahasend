  /v2/accounts/{account_id}/campaigns/{campaign_id}/test:
    post:
      summary: Test Campaign
      description: 'Sends a test of a draft campaign to up to 5 addresses. Each address

        gets the design with placeholders for the contact''s fields; its

        links lead to a contact that does not exist. A campaign with any

        issue but `unsubscribe_link_missing` is refused with the issues.


        An account can send 50 test emails per day (UTC), counted per

        address, from the API and the dashboard together. An address the

        mail server refused still counts; a test that sent nothing (502)

        does not.


        With an `Idempotency-Key`, a 2xx answer is stored and replayed, so a

        retry with the same key sends nothing again. Unlike other

        operations, a 4xx answer is not stored: it releases the key, so a

        retry with the same key, for example after the daily limit resets,

        is answered afresh.'
      operationId: testCampaign
      tags:
      - Campaigns
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: campaign_id
