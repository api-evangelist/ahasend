          description: 'Invalid campaign_id, an invalid body or address, no address or more than 5, a campaign with issues (with `issues`), a sender domain that is paused or no longer verified, an account that cannot send, or a test the template check refuses, in which case nothing is sent: content that cannot be rendered with a recipient''s values, a call to `random`, `randrange`, `lipsum` or `now`, `namespace`, a work, output, memory or time limit, or an address the check cannot read (`<email>: the message could not be rendered: <reason>`, or without `<email>: ` when no recipient had started rendering)

