  /v2/accounts/{account_id}/campaigns/{campaign_id}/send:
    post:
      summary: Send Campaign
      description: 'Sends a draft campaign now, or at `send_at`. A campaign with any

        issue is refused with the issues. The send then checks what would

        stop the campaign at its send time: its sender domain must still be

        verified and not paused, the account must be able to send, and its

        lists must have subscribed contacts. For a send at a later time, a

        block that a payment or the next billing period can clear is a

        warning instead of a refusal.


        The campaign moves to `validating` and goes through the same list

        validation and review as a send from the dashboard, which move it on

        from there. Read `status` and `status_reason` with Get Campaign. To

        change the send time, unschedule the campaign and send it again.'
