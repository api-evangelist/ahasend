openapi: 3.2.0
info:
  title: AhaSend API v2 Campaigns API
  description: 'The AhaSend API v2 allows you to send transactional emails, manage domains, webhooks, routes, API keys, and view statistics. ## Authentication

    All API requests must be authenticated using a Bearer token in the Authorization header:

    ```

    Authorization: Bearer aha-sk-64-CHARACTER-RANDOM-STRING

    ```


    ## Scopes

    API keys have specific scopes that control access to different resources and actions:


    ### Message Scopes

    - `messages:send:all` - Send messages from any domain in the account

    - `messages:send:{domain}` - Send messages from a specific domain

    - `messages:cancel:all` - Cancel messages from any domain

    - `messages:cancel:{domain}` - Cancel messages from a specific domain

    - `messages:read:all` - Read messages from any domain

    - `messages:read:{domain}` - Read messages from a specific domain


    ### Domain Scopes

    - `domains:read` - Read all domains

    - `domains:write` - Create and update domains

    - `domains:delete:all` - Delete any domain

    - `domains:delete:{domain}` - Delete a specific domain


    ### Account Scopes

    - `accounts:read` - Read account information

    - `accounts:write` - Update account settings

    - `accounts:billing` - Access billing information

    - `accounts:members:read` - Read account members

    - `accounts:members:add` - Add account members

    - `accounts:members:update` - Update account members

    - `accounts:members:remove` - Remove account members


    ### Webhook Scopes

    - `webhooks:read:all` - Read all webhooks

    - `webhooks:read:{domain}` - Read webhooks for a specific domain

    - `webhooks:write:all` - Create and update webhooks

    - `webhooks:write:{domain}` - Create and update webhooks for a specific domain

    - `webhooks:delete:all` - Delete any webhook

    - `webhooks:delete:{domain}` - Delete webhooks for a specific domain


    ### Route Scopes

    - `routes:read:all` - Read all routes

    - `routes:read:{domain}` - Read routes for a specific domain

    - `routes:write:all` - Create and update routes

    - `routes:write:{domain}` - Create and update routes for a specific domain

    - `routes:delete:all` - Delete any route

    - `routes:delete:{domain}` - Delete routes for a specific domain


    ### Suppression Scopes

    - `suppressions:read` - Read suppressions

    - `suppressions:write` - Create suppressions

    - `suppressions:delete` - Delete suppressions

    - `suppressions:wipe` - Delete the account''s suppressions except protected ones (dangerous)


    ### Template Scopes

    - `templates:read` - Read transactional templates, their drafts and their published versions, and campaign templates

    - `templates:write` - Create and update transactional templates, and publish, discard and restore their drafts; create and update campaign templates

    - `templates:delete` - Delete transactional templates and campaign templates


    ### Campaign Scopes

    - `campaigns:read` - Read campaigns, their stats and their recipients

    - `campaigns:write` - Create, update and duplicate campaigns

    - `campaigns:delete` - Delete draft campaigns

    - `campaigns:send` - Send, unschedule and test-send campaigns


    ### Contact Scopes

    - `contacts:read` - Read contacts

    - `contacts:write` - Create and update contacts

    - `contacts:delete` - Delete contacts


    ### Contact lifecycle and attributes

    Contacts are account-global. A contact created through this API joins no

    list on its own; campaigns target lists, so add it to one with the Lists

    endpoints before a campaign can reach it. Contact subscription state and suppression records are independent:

    creating, updating, unsubscribing, resubscribing, or deleting a contact

    never creates, changes, or removes complaint, permanent, or protected

    suppressions. Prefer unsubscribe over delete when the goal is only to stop

    marketing mail, because unsubscribe is reversible and preserves contact

    history. Writable attribute keys and types come from the account''s contact-attribute

    definitions managed in the dashboard; this API does not expose property

    definition CRUD.'
  version: 2.0.0
  contact:
    email: support@ahasend.com
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://api.ahasend.com
  description: Production server
security:
- BearerAuth: []
tags:
- name: Campaigns
  description: Create, change, read, duplicate, delete, test and send the account's marketing campaigns, and read their stats and recipients
paths:
  /v2/accounts/{account_id}/campaigns:
    get:
      summary: List Campaigns
      description: 'Returns a cursor-paginated list of the account''s marketing campaigns,

        newest first. Each campaign is listed without its lists, content and

        issues; Get Campaign returns them.'
      operationId: listCampaigns
      tags:
      - Campaigns
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        description: Only campaigns in this status.
        schema:
          $ref: '#/components/schemas/CampaignStatus'
      - name: limit
        in: query
        description: Maximum number of items to return (1-100)
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: after
        in: query
        description: Pagination cursor for the next page. Provide the value from `next_cursor` in the response.
        schema:
          type: string
      - name: before
        in: query
        description: Pagination cursor for the previous page. Provide the value from `previous_cursor` in the response.
        schema:
          type: string
      security:
      - BearerAuth:
        - campaigns:read
      responses:
        '200':
          description: Paginated campaigns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCampaignsResponse'
        '400':
          description: Invalid status, limit or cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing `campaigns:read` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/common\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  // Leave Status nil to list campaigns in every status.\n  response, _, err := client.CampaignsAPI.ListCampaigns(ctx, accountID, requests.ListCampaignsParams{\n    Status: ahasend.String(common.CampaignStatusScheduled),\n    Limit:  ahasend.Int32(100),\n  })\n  if err != nil {\n    log.Fatalf(\"Error listing campaigns: %v\", err)\n  }\n  for _, campaign := range response.Data {\n    if campaign.SendAt != nil {\n      fmt.Printf(\"%s %s sends at %s\\n\", campaign.ID, campaign.Name, campaign.SendAt)\n    }\n  }\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: 'import { AhaSendClient } from "@ahasend/sdk";


          const client = AhaSendClient.fromEnv();

          const page = await client.campaigns.list({ status: "draft", limit: 20 });

          console.log("Campaigns listed.", { count: page.data.length });

          '
    post:
      summary: Create Campaign
      description: 'Creates a draft marketing campaign. Every field but `name` is

        optional and can be set later with Update Campaign; the campaign

        answers its `issues` until it is ready to send.


        The design comes from `content` (`content.mjml` makes an `advanced`

        design and `content.html` an `html` one), from an `editor` alone (an

        empty design the dashboard''s editor opens), or from a campaign

        template named by `template_id`, which the campaign copies. MJML is

        compiled in strict mode, and HTML must use full `https://` URLs for

        its images and stylesheets: the API cannot upload files.


        The subject, preview text, sender and reply-to are checked by the

        rules of the dashboard, and their refusals use the dashboard''s

        sentences.'
      operationId: createCampaign
      tags:
      - Campaigns
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - BearerAuth:
        - campaigns:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
      responses:
        '201':
          description: Campaign created
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          description: 'Invalid request: the body or a field, a list or campaign template that does not exist. The message names the field and the problem.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing `campaigns:write` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/IdempotencyPayloadMismatch'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/common\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  listID := uuid.MustParse(\"22222222-2222-4222-8222-222222222222\")\n  templateID := uuid.MustParse(\"33333333-3333-4333-8333-333333333333\")\n\n  // The campaign copies the campaign template's design; later changes to\n  // the template do not reach it. Every field but Name can be set later.\n  response, _, err := client.CampaignsAPI.CreateCampaign(ctx, accountID, requests.CreateCampaignRequest{\n    Name:      \"October newsletter\",\n    Subject:   ahasend.String(\"Our news for October, {{ first_name }}\"),\n    Preheader: ahasend.String(\"Three things we shipped this month\"),\n    From: &common.SenderAddress{\n      Email: \"news@yourdomain.com\",\n      Name:  ahasend.String(\"Example\"),\n    },\n    ListIDs:    []uuid.UUID{listID},\n    TemplateID: &templateID,\n  })\n  if err != nil {\n    log.Fatalf(\"Error creating campaign: %v\", err)\n  }\n  fmt.Printf(\"Created campaign %s, ready: %t\\n\", response.ID, response.Ready != nil && *response.Ready)\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: "import { AhaSendClient } from \"@ahasend/sdk\";\n\nconst client = AhaSendClient.fromEnv();\n// The SDK sends a fresh Idempotency-Key automatically and reuses it on its own retries.\nconst campaign = await client.campaigns.create({\n  name: \"October newsletter\",\n  subject: \"What is new in October\",\n  preheader: \"Three things we shipped this month\",\n  from: { email: \"news@example.com\", name: \"Example\" },\n  list_ids: [\"00000000-0000-4000-8000-000000000010\"],\n  template_id: \"00000000-0000-4000-8000-000000000013\",\n});\nconsole.log(\"Campaign created.\", { id: campaign.id, ready: campaign.ready });\n"
  /v2/accounts/{account_id}/campaigns/{campaign_id}:
    get:
      summary: Get Campaign
      description: 'Returns one of the account''s campaigns with its lists, its content

        and, for a draft, the issues that keep it from being sent.'
      operationId: getCampaign
      tags:
      - Campaigns
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: campaign_id
        in: path
        required: true
        description: Campaign ID
        schema:
          type: string
          format: uuid
      security:
      - BearerAuth:
        - campaigns:read
      responses:
        '200':
          description: Campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          description: Invalid campaign_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing `campaigns:read` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  campaignID := uuid.MustParse(\"11111111-1111-4111-8111-111111111111\")\n\n  response, _, err := client.CampaignsAPI.GetCampaign(ctx, accountID, campaignID)\n  if err != nil {\n    log.Fatalf(\"Error getting campaign: %v\", err)\n  }\n  fmt.Printf(\"%s is %s, sending to %d lists\\n\", response.Name, response.Status, len(response.ListIDs))\n  // A draft lists what keeps it from being sent.\n  for _, issue := range response.Issues {\n    fmt.Printf(\"%s: %s\\n\", issue.Code, issue.Message)\n  }\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: 'import { AhaSendClient } from "@ahasend/sdk";


          const client = AhaSendClient.fromEnv();

          const campaignId = "00000000-0000-4000-8000-000000000014";

          const campaign = await client.campaigns.get(campaignId);

          console.log("Campaign found.", { id: campaign.id, status: campaign.status, ready: campaign.ready });

          '
    put:
      summary: Update Campaign
      description: 'Changes a draft campaign. A field the request leaves out is neither

        changed nor checked, and `null` clears `subject`, `preheader`, `from`

        and `reply_to`. A campaign that is not a draft cannot be changed.


        The change waits for any other change of the same campaign, from the

        dashboard or the API, and a send that starts after it reads it. The

        design of a `simple` campaign can be changed only in the dashboard:

        send only `content.text` for one. Between this request and a

        dashboard editor open on the same campaign, the later design save

        wins.'
      operationId: updateCampaign
      tags:
      - Campaigns
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: campaign_id
        in: path
        required: true
        description: Campaign ID
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - BearerAuth:
        - campaigns:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCampaignRequest'
      responses:
        '200':
          description: Campaign updated
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          description: Invalid campaign_id, an invalid body or field, a list that does not exist, or a request with no changes. The message names the field and the problem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing `campaigns:write` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/CampaignConflict'
        '422':
          $ref: '#/components/responses/IdempotencyPayloadMismatch'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  campaignID := uuid.MustParse(\"11111111-1111-4111-8111-111111111111\")\n\n  // Only the fields you set change, and only while the campaign is a\n  // draft. A ReplyTo that points at \"\" clears the reply-to address.\n  response, _, err := client.CampaignsAPI.UpdateCampaign(ctx, accountID, campaignID, requests.UpdateCampaignRequest{\n    Subject: ahasend.String(\"Our news for October\"),\n    ReplyTo: ahasend.String(\"\"),\n  })\n  if err != nil {\n    log.Fatalf(\"Error updating campaign: %v\", err)\n  }\n  fmt.Printf(\"Updated campaign %s, %d issues left\\n\", response.Name, len(response.Issues))\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: "import { AhaSendClient } from \"@ahasend/sdk\";\n\nconst client = AhaSendClient.fromEnv();\n// The SDK sends a fresh Idempotency-Key automatically and reuses it on its own retries.\nconst campaignId = \"00000000-0000-4000-8000-000000000014\";\n// Only a draft can change; null clears the reply-to address.\nconst campaign = await client.campaigns.update(campaignId, {\n  subject: \"What we shipped in October\",\n  reply_to: null,\n});\nconsole.log(\"Campaign updated.\", { id: campaign.id, ready: campaign.ready });\n"
    delete:
      summary: Delete Campaign
      description: 'Deletes a draft campaign with its design and its list choices. A

        campaign that is not a draft cannot be deleted, and a second delete

        answers 404.'
      operationId: deleteCampaign
      tags:
      - Campaigns
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: campaign_id
        in: path
        required: true
        description: Campaign ID
        schema:
          type: string
          format: uuid
      security:
      - BearerAuth:
        - campaigns:delete
      responses:
        '200':
          description: Campaign deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid campaign_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing `campaigns:delete` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The campaign is not a draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  campaignID := uuid.MustParse(\"11111111-1111-4111-8111-111111111111\")\n\n  // Only a draft can be deleted.\n  response, _, err := client.CampaignsAPI.DeleteCampaign(ctx, accountID, campaignID)\n  if err != nil {\n    log.Fatalf(\"Error deleting campaign: %v\", err)\n  }\n  fmt.Println(response.Message)\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: 'import { AhaSendClient } from "@ahasend/sdk";


          const client = AhaSendClient.fromEnv();

          const campaignId = "00000000-0000-4000-8000-000000000014";

          const result = await client.campaigns.delete(campaignId);

          console.log("Campaign deleted.", { message: result.message });

          '
  /v2/accounts/{account_id}/campaigns/{campaign_id}/duplicate:
    post:
      summary: Duplicate Campaign
      description: 'Makes a new draft from a campaign in any status: a copy of its

        design, its subject, preview text, sender and reply-to address, and

        its lists that still exist, in the same order. The copy''s design is

        its own.'
      operationId: duplicateCampaign
      tags:
      - Campaigns
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: campaign_id
        in: path
        required: true
        description: Campaign ID
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - BearerAuth:
        - campaigns:write
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateCampaignRequest'
      responses:
        '201':
          description: Campaign duplicated
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          description: Invalid campaign_id, or an invalid body or name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing `campaigns:write` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/IdempotencyPayloadMismatch'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
