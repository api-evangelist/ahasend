openapi: 3.2.0
info:
  title: AhaSend API v2 Messages API
  description: 'The AhaSend API v2 allows you to send transactional emails, manage domains, webhooks, routes, API keys, and view statistics. ## Authentication

    All API requests must be authenticated using a Bearer token in the Authorization header:

    ```

    Authorization: Bearer aha-sk-64-CHARACTER-RANDOM-STRING

    ```


    ## Scopes

    API keys have specific scopes that control access to different resources and actions:


    ### Message Scopes

    - `messages:send:all` - Send messages from any domain in the account

    - `messages:send:{domain}` - Send messages from a specific domain

    - `messages:cancel:all` - Cancel messages from any domain

    - `messages:cancel:{domain}` - Cancel messages from a specific domain

    - `messages:read:all` - Read messages from any domain

    - `messages:read:{domain}` - Read messages from a specific domain


    ### Domain Scopes

    - `domains:read` - Read all domains

    - `domains:write` - Create and update domains

    - `domains:delete:all` - Delete any domain

    - `domains:delete:{domain}` - Delete a specific domain


    ### Account Scopes

    - `accounts:read` - Read account information

    - `accounts:write` - Update account settings

    - `accounts:billing` - Access billing information

    - `accounts:members:read` - Read account members

    - `accounts:members:add` - Add account members

    - `accounts:members:update` - Update account members

    - `accounts:members:remove` - Remove account members


    ### Webhook Scopes

    - `webhooks:read:all` - Read all webhooks

    - `webhooks:read:{domain}` - Read webhooks for a specific domain

    - `webhooks:write:all` - Create and update webhooks

    - `webhooks:write:{domain}` - Create and update webhooks for a specific domain

    - `webhooks:delete:all` - Delete any webhook

    - `webhooks:delete:{domain}` - Delete webhooks for a specific domain


    ### Route Scopes

    - `routes:read:all` - Read all routes

    - `routes:read:{domain}` - Read routes for a specific domain

    - `routes:write:all` - Create and update routes

    - `routes:write:{domain}` - Create and update routes for a specific domain

    - `routes:delete:all` - Delete any route

    - `routes:delete:{domain}` - Delete routes for a specific domain


    ### Suppression Scopes

    - `suppressions:read` - Read suppressions

    - `suppressions:write` - Create suppressions

    - `suppressions:delete` - Delete suppressions

    - `suppressions:wipe` - Delete the account''s suppressions except protected ones (dangerous)


    ### Template Scopes

    - `templates:read` - Read transactional templates, their drafts and their published versions, and campaign templates

    - `templates:write` - Create and update transactional templates, and publish, discard and restore their drafts; create and update campaign templates

    - `templates:delete` - Delete transactional templates and campaign templates


    ### Campaign Scopes

    - `campaigns:read` - Read campaigns, their stats and their recipients

    - `campaigns:write` - Create, update and duplicate campaigns

    - `campaigns:delete` - Delete draft campaigns

    - `campaigns:send` - Send, unschedule and test-send campaigns


    ### Contact Scopes

    - `contacts:read` - Read contacts

    - `contacts:write` - Create and update contacts

    - `contacts:delete` - Delete contacts


    ### Contact lifecycle and attributes

    Contacts are account-global. A contact created through this API joins no

    list on its own; campaigns target lists, so add it to one with the Lists

    endpoints before a campaign can reach it. Contact subscription state and suppression records are independent:

    creating, updating, unsubscribing, resubscribing, or deleting a contact

    never creates, changes, or removes complaint, permanent, or protected

    suppressions. Prefer unsubscribe over delete when the goal is only to stop

    marketing mail, because unsubscribe is reversible and preserves contact

    history. Writable attribute keys and types come from the account''s contact-attribute

    definitions managed in the dashboard; this API does not expose property

    definition CRUD.'
  version: 2.0.0
  contact:
    email: support@ahasend.com
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://api.ahasend.com
  description: Production server
security:
- BearerAuth: []
tags:
- name: Messages
  description: Send and manage transactional messages
paths:
  /v2/accounts/{account_id}/messages:
    get:
      summary: Get Messages
      description: 'Returns a list of message summaries for the account. Can be filtered by various parameters.


        `messages:read:all` can read across the account. Domain-scoped keys see

        only messages for domains authorized by their matching read roles.'
      operationId: getMessages
      tags:
      - Messages
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        description: 'Filter by comma-separated list of message statuses. Allowed values are:

          `Received`, `Delivered`, `Opened`, `Clicked`, `Deferred`, `Bounced`, `Failed`, `Suppressed`,

          `Sandbox Delivered`, `Sandbox Deferred`, `Sandbox Failed`, `Sandbox Bounced`,

          and `Sandbox Suppressed`.


          Delivery and engagement statuses are cumulative: `Delivered` also matches messages

          currently marked `Opened` or `Clicked`, and `Opened` also matches messages currently

          marked `Clicked`.

          '
        schema:
          type: string
        example: Bounced,Failed
      - name: sender
        in: query
        description: Sender email address (must be from domain in API key scopes)
        schema:
          type: string
          format: email
      - name: recipient
        in: query
        description: Recipient email address
        schema:
          type: string
          format: email
      - name: subject
        in: query
        description: Filter by subject text
        schema:
          type: string
      - name: message_id_header
        in: query
        description: Filter by message ID header (same ID returned by CreateMessage API)
        schema:
          type: string
      - name: tags
        in: query
        description: Filter by comma-separated list of tags (max 20)
        schema:
          type: string
        example: billing,urgent
      - name: from_time
        in: query
        description: Filter messages created after this time (RFC3339 format)
        schema:
          type: string
          format: date-time
        example: '2023-12-25T10:30:00Z'
      - name: to_time
        in: query
        description: Filter messages created before this time (RFC3339 format)
        schema:
          type: string
          format: date-time
        example: '2023-12-26T10:30:00Z'
      - name: limit
        in: query
        description: Maximum number of items to return (1-100)
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: after
        in: query
        description: Pagination cursor for the next page. Provide the value provided in `next_cursor` from the response.
        schema:
          type: string
      - name: before
        in: query
        description: Pagination cursor for the previous page.
        schema:
          type: string
      security:
      - BearerAuth:
        - messages:read:all
      - BearerAuth:
        - messages:read:{domain}
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  response, _, err := client.MessagesAPI.GetMessages(ctx, accountID, requests.GetMessagesParams{\n    Status: ahasend.String(\"Bounced,Failed\"),\n    Sender: ahasend.String(\"info@example.com\"),\n    Tags:   []string{\"billing\", \"urgent\"},\n  })\n  if err != nil {\n    log.Fatalf(\"Error getting messages: %v\", err)\n  }\n  for _, message := range response.Data {\n    fmt.Printf(\"%s %s %s\\n\", message.MessageID, message.Recipient, message.Status)\n  }\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: 'import { AhaSendClient } from "@ahasend/sdk";


          const client = AhaSendClient.fromEnv();

          const page = await client.messages.list({ limit: 20 });

          console.log("Messages listed.", { count: page.data.length });

          '
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMessagesResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create Message
      description: 'Creates and sends a message to one or more recipients. This API cannot be used if you want to send a conversational/P2P message and set CC or BCC. Use Create Conversation Message instead.


        **Validation Requirements:**

        - Either `text_content` or `html_content` is required

        - `from.email` must be from a domain you own with valid DNS records

        - `retention.metadata` must be between 1 and 30 days

        - `retention.data` must be between 0 and 30 days

        - If `reply_to` is provided, do not include `reply-to` in headers

        - `message-id` header will be ignored and automatically generated

        - Schedule times must be in RFC3339 format

        - `schedule.first_attempt` must be in the future and within 7 days of the request

        - `schedule.expires` must be in the future and within 8 days of the request


        **Headers and subject:**

        - Header names must be visible ASCII with no space and no colon. An empty name, or one holding a space, a colon or a line break, is rejected.

        - A substitution value that a header uses must not contain a line break. Such a request is rejected, and the error names the recipient.

        - A `{{ name }}` in a subject that carries an emoji or an accented character is replaced before the message is built, for each recipient whose message carries substitutions. Such a subject is rejected when it holds template syntax other than `{{ name }}`, when a substitution value holds `{{`, `{%` or `{#`, or when the subject and the values combine into template syntax. See `subject`.


        Authorization uses the domain in `from.email`: either

        `messages:send:all` or the matching domain-specific send role is

        sufficient.'
      operationId: createMessage
      tags:
      - Messages
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - BearerAuth:
        - messages:send:all
      - BearerAuth:
        - messages:send:{domain}
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/common\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  // The SDK sends a fresh Idempotency-Key with every POST and reuses it on its\n  // own retries. Deriving the key from your own ID instead also makes a rerun\n  // of the same job (after a crash, say) return the first send, not a second.\n  orderID := \"1234\"\n\n  response, _, err := client.MessagesAPI.CreateMessage(ctx, accountID, requests.CreateMessageRequest{\n    From: common.SenderAddress{\n      Email: \"info@example.com\",\n      Name:  ahasend.String(\"Example Corp.\"),\n    },\n    Recipients: []common.Recipient{\n      {\n        Email: \"john@example.com\",\n        Name:  ahasend.String(\"John Smith\"),\n      },\n    },\n    Subject:     \"Hello\",\n    TextContent: ahasend.String(\"Hello world!\"),\n    Sandbox:     ahasend.Bool(true),\n  }, api.WithIdempotencyKey(\"order-\"+orderID+\"-receipt\"))\n  if err != nil {\n    log.Fatalf(\"Error sending message: %v\", err)\n  }\n  // Each recipient gets its own message, or an error saying why it was not sent.\n  for _, message := range response.Data {\n    if message.ID != nil {\n      fmt.Printf(\"%s: %s\\n\", message.Recipient.Email, *message.ID)\n    } else if message.Error != nil {\n      fmt.Printf(\"%s: %s\\n\", message.Recipient.Email, *message.Error)\n    }\n  }\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: "import { AhaSendClient } from \"@ahasend/sdk\";\n\nconst client = AhaSendClient.fromEnv();\n// The SDK sends a fresh Idempotency-Key automatically and reuses it on its own retries.\nconst result = await client.messages.send({\n  from: { email: \"sender@example.com\", name: \"Example\" },\n  recipients: [{ email: \"recipient@example.net\" }],\n  subject: \"Hello from AhaSend\",\n  html_content: \"<p>Hello!</p>\",\n  sandbox: true,\n});\nconsole.log(\"Sandbox message accepted.\", { count: result.data.length });\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '202':
          description: Message created successfully
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMessageResponse'
        '400':
          description: 'Bad request. Every message is checked before it is sent. A message is refused, and nothing of the request is sent, when its content cannot be rendered with a recipient''s values, calls `random`, `randrange`, `lipsum` or `now`, uses `namespace`, passes a work, output, memory or time limit, or has a recipient address the check cannot read. The message is `<email>: the message could not be rendered: <reason>`, or without `<email>: ` when no recipient had started rendering. A refused request with an `Idempotency-Key` gets the same answer again for that key.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                render_refused:
                  summary: A recipient's values make the content fail
                  value:
                    message: 'john@example.com: the message could not be rendered: unknown function: nosuch'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Forbidden. For example, the API key cannot send from the domain, the account cannot send, or sending from the domain is paused. A sandbox message is accepted from a paused domain.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                domain_paused:
                  summary: Sending from the domain is paused
                  value:
                    message: Sending from domain 'example.com' is paused. Check your dashboard for the reason.
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/IdempotencyPayloadMismatch'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/TemplateCheckBusy'
  /v2/accounts/{account_id}/messages/template:
    post:
      summary: Create Template Message
      description: 'Sends a stored transactional template to one or more recipients. Each recipient gets a separate message. The template supplies the body. It also supplies the subject, the sender and the reply-to when the request does not give them. To send content that is not stored in a template, use Create Message. **The message:**

        The message has the template''s HTML body, with the template''s preview text added, and the template''s text body. It has no AMP part. The message records the template: the message''s `template_id` (Get Message) is the ID of this template. **Variables:**

        Values for the template''s variables come only from each recipient''s `substitutions`. Every recipient must give a value for each required variable of the template (see `variables` on Get Template). If a recipient does not, the request is rejected with a 400 that names each recipient and the variables it does not give, and no message is sent. A value for a name that the template does not use is accepted. To fill a `list` variable, send an array; the template''s `variables` show the fields each element needs. Your `subject` and `headers` resolve from the same values. A `{{ name }}` that has no value becomes empty. **Reserved variables:**

        The send supplies `email` for each recipient: the recipient''s address. When the template''s design uses `unsubscribe_url`, the send also supplies it: a link made for each recipient. The message then carries `List-Unsubscribe` with that link and `List-Unsubscribe-Post: List-Unsubscribe=One-Click`, so the unsubscribe button of a mail client works. That button suppresses the recipient for the sending domain at once. The link opens a confirmation page, and the suppression happens when the recipient confirms. A `List-Unsubscribe` or `List-Unsubscribe-Post` in your `headers` is dropped, in any letter case. When the design does not use `unsubscribe_url`, no link is made and your headers are sent as you give them. A recipient''s own value for a reserved variable is replaced. **Fields that are not accepted:**

        These fields at the top of the request are rejected with a 400. Any value except `null` is rejected, `""` and `{}` included. - `substitutions`: `substitutions go on each recipient, not at the top of the request`

        - `text_content`, `html_content` and `amp_content`: ` is not accepted, the template supplies the body`, with the name of the field


        A request with more than one of them gets the error for the first in this list. These fields are checked as soon as the request body is read, before the rest of the request. **Sender:**

        - When the request has no `from`, the message is sent from the template''s default sender. When the template has no default sender, the request is rejected with a 400 `from is required because the template has no default sender`. - A `from` given in the request is used even when the template has a default sender. It must have an `email`, and it is checked as on Create Message. - The sender, the request''s or the template''s, must be from a domain you own with valid DNS records. - When the request has no `reply_to` and no `reply-to` in `headers`, the template''s reply-to is used. **Subject:**

        The request''s `subject` is used when it holds more than spaces. If not, the template''s published subject is used. When neither has a subject, the request is rejected with a 400 `the template has no subject, publish one on the template page or pass subject`. **Headers and subject:**

        - Header names must be visible ASCII with no space and no colon. An empty name, or one holding a space, a colon or a line break, is rejected. - A substitution value that a header uses must not contain a line break. Such a request is rejected, and the error names the recipient. - A `{{ name }}` in a subject that carries an emoji or an accented character is replaced before the message is built, on every send.'
      operationId: createTemplateMessage
      tags:
      - Messages
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - BearerAuth:
        - messages:send:all
      - BearerAuth:
        - messages:send:{domain}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateMessageRequest'
      responses:
        '202':
          description: Message created successfully
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMessageResponse'
        '400':
          description: 'Bad request. Every message is checked before it is sent. A message is refused, and nothing of the request is sent, when its content cannot be rendered with a recipient''s values, calls `random`, `randrange`, `lipsum` or `now`, uses `namespace`, passes a work, output, memory or time limit, or has a recipient address the check cannot read. The message is `<email>: the message could not be rendered: <reason>`, or without `<email>: ` when no recipient had started rendering. A refused request with an `Idempotency-Key` gets the same answer again for that key.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_variables:
                  summary: A recipient does not give a required variable
                  value:
                    message: 'missing required template variables: user@example.com needs first_name, order_id'
                render_refused:
                  summary: A recipient's values make the template fail
                  value:
                    message: 'john@example.com: the message could not be rendered: unknown function: nosuch'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Forbidden. For example, the API key cannot send from the domain of the sender, the account cannot send, or sending from the domain is paused. A sandbox message is accepted from a paused domain. A request with no `from` is refused with `this api key is not authorized to send messages` when the API key cannot send from any domain.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                domain_paused:
                  summary: Sending from the domain is paused
                  value:
                    message: Sending from domain 'example.com' is paused. Check your dashboard for the reason.
        '404':
          description: '`template not found`: `template_id` is not the ID of one of this account''s transactional templates. A deleted template, a campaign design and a template of another account get this answer too.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/IdempotencyPayloadMismatch'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/TemplateCheckBusy'
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/common\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  templateID := uuid.MustParse(\"11111111-1111-4111-8111-111111111111\")\n\n  // The template supplies the body, and the subject and sender when the\n  // request leaves them out. Each recipient gives its own variable values.\n  // For a template with no default sender, set From to an address on one of\n  // your domains.\n  response, _, err := client.MessagesAPI.CreateTemplateMessage(ctx, accountID, requests.CreateTemplateMessageRequest{\n    TemplateID: templateID,\n    Recipients: []common.Recipient{\n      {\n        Email: \"john@example.com\",\n        Name:  ahasend.String(\"John Smith\"),\n        Substitutions: map[string]interface{}{\n          \"first_name\": \"John\",\n          \"order_id\":   \"12345\",\n        },\n      },\n    },\n    Sandbox: ahasend.Bool(true),\n  })\n  if err != nil {\n    log.Fatalf(\"Error sending message: %v\", err)\n  }\n  // Each recipient gets its own message, or an error saying why it was not sent.\n  for _, message := range response.Data {\n    if message.ID != nil {\n      fmt.Printf(\"%s: %s\\n\", message.Recipient.Email, *message.ID)\n    } else if message.Error != nil {\n      fmt.Printf(\"%s: %s\\n\", message.Recipient.Email, *message.Error)\n    }\n  }\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: "import { AhaSendClient } from \"@ahasend/sdk\";\n\nconst client = AhaSendClient.fromEnv();\n// The SDK sends a fresh Idempotency-Key automatically and reuses it on its own retries.\nconst result = await client.messages.sendTemplate({\n  template_id: \"00000000-0000-4000-8000-000000000009\",\n  recipients: [{ email: \"recipient@example.net\", substitutions: { first_name: \"Ada\" } }],\n  sandbox: true,\n});\nconsole.log(\"Sandbox template message accepted.\", { count: result.data.length });\n"
  /v2/accounts/{account_id}/messages/conversation:
    post:
      summary: Create Conversational Message
      description: 'Creates and sends a conversational message (with support for CC and BCC) to one or more recipients. This API does not support template substitutions, use Create Message instead if you need substitutions.


        **Validation Requirements:**

        - Either `text_content` or `html_content` is required

        - `from.email` must be from a domain you own with valid DNS records

        - `retention.metadata` must be between 1 and 30 days

        - `retention.data` must be between 0 and 30 days

        - If the `reply_to` parameter is provided, do not include `reply-to` in headers

        - If the `cc` parameter is provided, do not include `cc` in headers

        - `message-id` header will be ignored and automatically generated

        - header names must be visible ASCII with no space and no colon; an empty name, or one holding a space, a colon or a line break, is rejected

        - Schedule times must be in RFC3339 format

        - `schedule.first_attempt` must be in the future and within 7 days of the request

        - `schedule.expires` must be in the future and within 8 days of the request


        Authorization uses the domain in `from.email`: either

        `messages:send:all` or the matching domain-specific send role is

        sufficient.'
      operationId: createConversationMessage
      tags:
      - Messages
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - BearerAuth:
        - messages:send:all
      - BearerAuth:
        - messages:send:{domain}
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/common\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  // A conversational message sets the To/CC/BCC headers directly, so\n  // recipients can see each other (BCC excluded). The combined\n  // To + CC + BCC count must not exceed 50. Unlike Create Message,\n  // this endpoint does not support template substitutions.\n  //\n  // The SDK sends a fresh Idempotency-Key with this POST and reuses it on\n  // its own retries, so a retried request is not applied twice.\n  response, _, err := client.MessagesAPI.CreateConversationMessage(ctx, accountID, requests.CreateConversationMessageRequest{\n    From: common.SenderAddress{\n      Email: \"info@example.com\",\n      Name:  ahasend.String(\"Example Corp.\"),\n    },\n    To: []common.SenderAddress{\n      {Email: \"john@example.com\", Name: ahasend.String(\"John Smith\")},\n      {Email: \"jane@example.com\", Name: ahasend.String(\"Jane Doe\")},\n    },\n    CC: []common.SenderAddress{\n      {Email: \"hr@example.com\", Name: ahasend.String(\"Example Corp HR\")},\n    },\n    BCC: []common.SenderAddress{\n      {Email: \"archive@example.com\"},\n    },\n    Subject:     \"Welcome to Example Corp\",\n    HtmlContent: ahasend.String(\"<h1>Dear John and Jane, welcome to Example Corp!</h1>\"),\n    TextContent: ahasend.String(\"Dear John and Jane, welcome to Example Corp!\"),\n    Sandbox:     ahasend.Bool(true),\n  })\n  if err != nil {\n    log.Fatalf(\"Error sending conversational message: %v\", err)\n  }\n  for _, message := range response.Data {\n    if message.ID != nil {\n      fmt.Printf(\"%s: %s\\n\", message.Recipient.Email, *message.ID)\n    } else if message.Error != nil {\n      fmt.Printf(\"%s: %s\\n\", message.Recipient.Email, *message.Error)\n    }\n  }\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: "import { AhaSendClient } from \"@ahasend/sdk\";\n\nconst client = AhaSendClient.fromEnv();\n// The SDK sends a fresh Idempotency-Key automatically and reuses it on its own retries.\nconst result = await client.messages.sendConversation({\n  from: { email: \"sender@example.com\", name: \"Example\" },\n  to: [{ email: \"recipient@example.net\" }],\n  subject: \"Hello from AhaSend\",\n  html_content: \"<p>Hello!</p>\",\n  sandbox: true,\n});\nconsole.log(\"Sandbox conversation accepted.\", { count: result.data.length });\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationMessageRequest'
      responses:
        '202':
          description: Message created successfully
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMessageResponse'
        '400':
          description: 'Bad request. Every message is checked before it is sent. A message is refused, and nothing of the request is sent, when its content cannot be rendered with a recipient''s values, calls `random`, `randrange`, `lipsum` or `now`, uses `namespace`, passes a work, output, memory or time limit, or has a recipient address the check cannot read. The message is `<email>: the message could not be rendered: <reason>`, or without `<email>: ` when no recipient had started rendering. A refused request with an `Idempotency-Key` gets the same answer again for that key.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                render_refused:
                  summary: A recipient's values make the content fail
                  value:
                    message: 'john@example.com: the message could not be rendered: unknown function: nosuch'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Forbidden. For example, the API key cannot send from the domain, the account cannot send, or sending from the domain is paused. A sandbox message is accepted from a paused domain.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                domain_paused:
                  summary: Sending from the domain is paused
                  value:
                    message: Sending from domain 'example.com' is paused. Check your dashboard for the reason.
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/IdempotencyPayloadMismatch'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/TemplateCheckBusy'
  /v2/accounts/{account_id}/messages/{message_id}:
    get:
      summary: Get Message
