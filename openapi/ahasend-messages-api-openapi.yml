openapi: 3.2.0
info:
  title: AhaSend API v2 Messages API
  description: The AhaSend API v2 allows you to send transactional emails, manage domains, webhooks, routes, API keys, and view statistics.
  version: 2.0.0
  contact:
    email: support@ahasend.com
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://api.ahasend.com
  description: Production server
security:
- BearerAuth: []
tags:
- name: Messages
  description: Send and manage transactional messages
paths:
  /v2/accounts/{account_id}/messages:
    get:
      summary: Get Messages
      description: 'Returns a list of message summaries for the account. Can be filtered by various parameters.


        `messages:read:all` can read across the account. Domain-scoped keys see

        only messages for domains authorized by their matching read roles.'
      operationId: getMessages
      tags:
      - Messages
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        description: 'Filter by comma-separated list of message statuses. Allowed values are:

          `Received`, `Delivered`, `Deferred`, `Bounced`, `Failed`, `Suppressed`,

          `Sandbox Delivered`, `Sandbox Deferred`, `Sandbox Failed`, `Sandbox Bounced`,

          and `Sandbox Suppressed`.

          '
        schema:
          type: string
        example: Bounced,Failed
      - name: sender
        in: query
        description: Sender email address (must be from domain in API key scopes)
        schema:
          type: string
          format: email
      - name: recipient
        in: query
        description: Recipient email address
        schema:
          type: string
          format: email
      - name: subject
        in: query
        description: Filter by subject text
        schema:
          type: string
      - name: message_id_header
        in: query
        description: Filter by message ID header (same ID returned by CreateMessage API)
        schema:
          type: string
      - name: tags
        in: query
        description: Filter by comma-separated list of tags (max 20)
        schema:
          type: string
        example: billing,urgent
      - name: from_time
        in: query
        description: Filter messages created after this time (RFC3339 format)
        schema:
          type: string
          format: date-time
        example: '2023-12-25T10:30:00Z'
      - name: to_time
        in: query
        description: Filter messages created before this time (RFC3339 format)
        schema:
          type: string
          format: date-time
        example: '2023-12-26T10:30:00Z'
      - name: limit
        in: query
        description: Maximum number of items to return (1-100)
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: after
        in: query
        description: Pagination cursor for the next page. Provide the value provided in `next_cursor` from the response.
        schema:
          type: string
      - name: before
        in: query
        description: Pagination cursor for the previous page.
        schema:
          type: string
      security:
      - BearerAuth:
        - messages:read:all
      - BearerAuth:
        - messages:read:{domain}
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  // Create API client with authentication\n  client := api.NewAPIClient(\n    api.WithAPIKey(\"aha-sk-your-64-character-key\"),\n  )\n\n  accountID := uuid.New()\n\n  // Create context for the API call\n  ctx := context.Background()\n\n  // Call the ping endpoint\n  response, httpResp, err := client.MessagesAPI.GetMessages(\n    ctx,\n    accountID,\n    requests.GetMessagesParams{\n      Status: ahasend.String(\"Bounced,Failed\"),\n      Sender: ahasend.String(\"info@example.com\"),\n      Tags:   []string{\"billing\", \"urgent\"},\n    },\n  )\n  if err != nil {\n    log.Fatalf(\"Error getting messages: %v\", err)\n  }\n\n  // Check response\n  if httpResp.StatusCode == 200 {\n    fmt.Printf(\"✅ Status: %d\\n\", httpResp.StatusCode)\n    if response != nil {\n      fmt.Printf(\"Found %d messages\\n\", len(response.Data))\n    }\n  } else {\n    fmt.Printf(\"❌ Unexpected status code: %d\\n\", httpResp.StatusCode)\n  }\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: 'import { AhaSendClient } from "@ahasend/sdk";


          const client = AhaSendClient.fromEnv();

          const page = await client.messages.list({ limit: 20 });

          console.log("Messages listed.", { count: page.data.length });

          '
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMessagesResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create Message
      description: 'Creates and sends a message to one or more recipients. This API cannot be used if you want to send a conversational/P2P message and set CC or BCC. Use Create Conversation Message instead.


        **Validation Requirements:**

        - Either `text_content` or `html_content` is required

        - `from.email` must be from a domain you own with valid DNS records

        - `retention.metadata` must be between 1 and 30 days

        - `retention.data` must be between 0 and 30 days

        - If `reply_to` is provided, do not include `reply-to` in headers

        - `message-id` header will be ignored and automatically generated

        - Schedule times must be in RFC3339 format

        - `schedule.first_attempt` must be in the future and within 7 days of the request

        - `schedule.expires` must be in the future and within 8 days of the request


        Authorization uses the domain in `from.email`: either

        `messages:send:all` or the matching domain-specific send role is

        sufficient.'
      operationId: createMessage
      tags:
      - Messages
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - BearerAuth:
        - messages:send:all
      - BearerAuth:
        - messages:send:{domain}
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/common\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  // Create API client with authentication\n  client := api.NewAPIClient(\n    api.WithAPIKey(\"aha-sk-your-64-character-key\"),\n  )\n\n  accountID := uuid.New()\n\n  // Create context for the API call\n  ctx := context.Background()\n\n  response, httpResp, err := client.MessagesAPI.CreateMessage(\n    ctx,\n    accountID,\n    requests.CreateMessageRequest{\n      From: common.Address{\n        Email: \"info@example.com\",\n        Name:  ahasend.String(\"Example Corp.\"),\n      },\n      Recipients: []common.Recipient{\n        {\n          Email: \"john@example.com\",\n          Name:  ahasend.String(\"John Smith\"),\n        },\n      },\n      Subject:     \"Hello\",\n      TextContent: ahasend.String(\"Hello world!\"),\n      Sandbox:     ahasend.Bool(true),\n    },\n  )\n  if err != nil {\n    log.Fatalf(\"Error sending message: %v\", err)\n  }\n\n  // Check response\n  if httpResp.StatusCode == 202 {\n    fmt.Printf(\"✅ Send successful! Status: %d\\n\", httpResp.StatusCode)\n    if response != nil {\n      fmt.Printf(\"Message ID: %s\\n\", *response.Data[0].ID)\n    }\n  } else {\n    fmt.Printf(\"❌ Unexpected status code: %d\\n\", httpResp.StatusCode)\n  }\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: "import { AhaSendClient } from \"@ahasend/sdk\";\n\nconst client = AhaSendClient.fromEnv();\nconst result = await client.messages.send(\n  {\n    from: { email: \"sender@example.com\", name: \"Example\" },\n    recipients: [{ email: \"recipient@example.net\" }],\n    subject: \"Hello from AhaSend\",\n    html_content: \"<p>Hello!</p>\",\n    sandbox: true,\n  },\n  { idempotencyKey: \"sdk-sample-send-message\" },\n);\nconsole.log(\"Sandbox message accepted.\", { count: result.data.length });\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '202':
          description: Message created successfully
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMessageResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/IdempotencyPayloadMismatch'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/accounts/{account_id}/messages/conversation:
    post:
      summary: Create Conversational Message
      description: 'Creates and sends a conversational message (with support for CC and BCC) to one or more recipients. This API does not support template substitutions, use Create Message instead if you need substitutions.


        **Validation Requirements:**

        - Either `text_content` or `html_content` is required

        - `from.email` must be from a domain you own with valid DNS records

        - `retention.metadata` must be between 1 and 30 days

        - `retention.data` must be between 0 and 30 days

        - If the `reply_to` parameter is provided, do not include `reply-to` in headers

        - If the `cc` parameter is provided, do not include `cc` in headers

        - `message-id` header will be ignored and automatically generated

        - Schedule times must be in RFC3339 format

        - `schedule.first_attempt` must be in the future and within 7 days of the request

        - `schedule.expires` must be in the future and within 8 days of the request


        Authorization uses the domain in `from.email`: either

        `messages:send:all` or the matching domain-specific send role is

        sufficient.'
      operationId: createConversationMessage
      tags:
      - Messages
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - BearerAuth:
        - messages:send:all
      - BearerAuth:
        - messages:send:{domain}
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/common\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  // Create API client with authentication\n  client := api.NewAPIClient(\n    api.WithAPIKey(\"aha-sk-your-64-character-key\"),\n  )\n\n  accountID := uuid.New()\n\n  // Create context for the API call\n  ctx := context.Background()\n\n  // A conversational message sets the To/CC/BCC headers directly, so\n  // recipients can see each other (BCC excluded). The combined\n  // To + CC + BCC count must not exceed 50. Unlike Create Message,\n  // this endpoint does not support template substitutions.\n  response, httpResp, err := client.MessagesAPI.CreateConversationMessage(\n    ctx,\n    accountID,\n    requests.CreateConversationMessageRequest{\n      From: common.SenderAddress{\n        Email: \"info@example.com\",\n        Name:  ahasend.String(\"Example Corp.\"),\n      },\n      To: []common.SenderAddress{\n        {Email: \"john@example.com\", Name: ahasend.String(\"John Smith\")},\n        {Email: \"jane@example.com\", Name: ahasend.String(\"Jane Doe\")},\n      },\n      CC: []common.SenderAddress{\n        {Email: \"hr@example.com\", Name: ahasend.String(\"Example Corp HR\")},\n      },\n      BCC: []common.SenderAddress{\n        {Email: \"archive@example.com\"},\n      },\n      Subject:     \"Welcome to Example Corp\",\n      HtmlContent: ahasend.String(\"<h1>Dear John and Jane, welcome to Example Corp!</h1>\"),\n      TextContent: ahasend.String(\"Dear John and Jane, welcome to Example Corp!\"),\n      Sandbox:     ahasend.Bool(true),\n    },\n  )\n  if err != nil {\n    log.Fatalf(\"Error sending conversational message: %v\", err)\n  }\n\n  // Check response\n  if httpResp.StatusCode == 202 {\n    fmt.Printf(\"✅ Send successful! Status: %d\\n\", httpResp.StatusCode)\n    if response != nil && len(response.Data) > 0 && response.Data[0].ID != nil {\n      fmt.Printf(\"Message ID: %s\\n\", *response.Data[0].ID)\n    }\n  } else {\n    fmt.Printf(\"❌ Unexpected status code: %d\\n\", httpResp.StatusCode)\n  }\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: "import { AhaSendClient } from \"@ahasend/sdk\";\n\nconst client = AhaSendClient.fromEnv();\nconst result = await client.messages.sendConversation(\n  {\n    from: { email: \"sender@example.com\", name: \"Example\" },\n    to: [{ email: \"recipient@example.net\" }],\n    subject: \"Hello from AhaSend\",\n    html_content: \"<p>Hello!</p>\",\n    sandbox: true,\n  },\n  { idempotencyKey: \"sdk-sample-send-conversation\" },\n);\nconsole.log(\"Sandbox conversation accepted.\", { count: result.data.length });\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationMessageRequest'
      responses:
        '202':
          description: Message created successfully
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMessageResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/IdempotencyPayloadMismatch'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/accounts/{account_id}/messages/{message_id}:
    get:
      summary: Get Message
      description: 'Returns the complete message by its ID, including raw content and parsed content structure.

        Access requires `messages:read:all` or a read role matching the

        message''s sender domain.'
      operationId: getMessage
      tags:
      - Messages
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: message_id
        in: path
        required: true
        description: Message API ID. Accepts the generated Message-ID returned by [Create Message API](https://ahasend.com/docs/api-reference/messages/create-message), for example `<uuid@example.com>`, or the bare UUID portion.
        schema:
          type: string
      security:
      - BearerAuth:
        - messages:read:all
      - BearerAuth:
        - messages:read:{domain}
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  // Create API client with authentication\n  client := api.NewAPIClient(\n    api.WithAPIKey(\"aha-sk-your-64-character-key\"),\n  )\n\n  accountID := uuid.New()\n  messageID := uuid.New()\n\n  // Create context for the API call\n  ctx := context.Background()\n\n  // Fetch a single message by ID\n  response, httpResp, err := client.MessagesAPI.GetMessage(ctx, accountID, messageID)\n  if err != nil {\n    log.Fatalf(\"Error getting message: %v\", err)\n  }\n\n  if httpResp.StatusCode == 200 {\n    fmt.Printf(\"✅ Message retrieved! Status: %d\\n\", httpResp.StatusCode)\n    if response != nil {\n      fmt.Printf(\"Subject: %s\\n\", response.Subject)\n      fmt.Printf(\"Status: %s\\n\", response.Status)\n      fmt.Printf(\"Sender: %s\\n\", response.Sender)\n      fmt.Printf(\"Recipient: %s\\n\", response.Recipient)\n      fmt.Printf(\"Attempts: %d\\n\", response.NumAttempts)\n      fmt.Printf(\"Opens: %d\\n\", response.OpenCount)\n      fmt.Printf(\"Clicks: %d\\n\", response.ClickCount)\n    }\n  } else {\n    fmt.Printf(\"❌ Unexpected status code: %d\\n\", httpResp.StatusCode)\n  }\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: 'import { AhaSendClient } from "@ahasend/sdk";


          const client = AhaSendClient.fromEnv();

          const messageId = "00000000-0000-4000-8000-000000000002";

          const message = await client.messages.get(messageId);

          console.log("Message found.", { id: message.id, status: message.status });

          '
      responses:
        '200':
          description: Message details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/accounts/{account_id}/messages/{message_id}/cancel:
    delete:
      summary: Cancel Message
      description: 'Cancels a scheduled message. Access requires `messages:cancel:all` or a

        cancel role matching the message''s sender domain.'
      operationId: cancelMessage
      tags:
      - Messages
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: message_id
        in: path
        required: true
        description: Message API ID. Accepts the generated Message-ID returned by [Create Message API](https://ahasend.com/docs/api-reference/messages/create-message), for example `<uuid@example.com>`, or the bare UUID portion.
        schema:
          type: string
      security:
      - BearerAuth:
        - messages:cancel:all
      - BearerAuth:
        - messages:cancel:{domain}
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  // Create API client with authentication\n  client := api.NewAPIClient(\n    api.WithAPIKey(\"aha-sk-your-64-character-key\"),\n  )\n\n  accountID := uuid.New()\n\n  // Create context for the API call\n  ctx := context.Background()\n\n  response, httpResp, err := client.MessagesAPI.CancelMessage(\n    ctx,\n    accountID,\n    \"<uuid@example.com>\",\n  )\n  if err != nil {\n    log.Fatalf(\"Error canceling message: %v\", err)\n  }\n\n  // Check response\n  if httpResp.StatusCode == 200 {\n    fmt.Printf(\"✅ Successfully canceled! Status: %d\\n\", httpResp.StatusCode)\n    if response != nil {\n      fmt.Printf(\"Message canceled: %s\\n\", response.Message)\n    }\n  } else {\n    fmt.Printf(\"❌ Unexpected status code: %d\\n\", httpResp.StatusCode)\n  }\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: 'import { AhaSendClient } from "@ahasend/sdk";


          const client = AhaSendClient.fromEnv();

          const messageId = "00000000-0000-4000-8000-000000000002";

          const result = await client.messages.cancel(messageId);

          console.log("Message cancellation requested.", { message: result.message });

          '
      responses:
        '200':
          description: Scheduled message is cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    MessageSummary:
      type: object
      properties:
        object:
          type: string
          enum:
          - message
          description: Object type identifier
        created_at:
          type: string
          format: date-time
          description: When the message was created
        updated_at:
          type: string
          format: date-time
          description: When the message was last updated
        sent_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the message was sent
        delivered_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the message was delivered
        retain_until:
          type: string
          format: date-time
          description: When the message data will be purged
        direction:
          type: string
          enum:
          - inbound
          - outbound
          description: Message direction
        is_bounce_notification:
          type: boolean
          description: Whether this is a bounce notification
        bounce_classification:
          type: string
          description: Classification of bounce if applicable
        delivery_attempts:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryEvent'
          description: List of delivery attempts for this message
        message_id:
          type: string
          description: Message-ID header value
        id:
          type:
          - string
          - 'null'
          format: uuid
          description: API-generated message ID
        subject:
          type: string
          description: Message subject
        tags:
          type: array
          items:
            type: string
          description: Tags associated with the message
        sender:
          type: string
          format: email
          description: Sender email address
        recipient:
          type: string
          format: email
          description: Recipient email address
        status:
          type: string
          description: Current message status
        num_attempts:
          type: integer
          description: Number of delivery attempts
        click_count:
          type: integer
          description: Number of clicks tracked for this message
        open_count:
          type: integer
          description: Number of opens tracked for this message
        reference_message_id:
          type:
          - integer
          - 'null'
          format: int64
          description: ID of the original message (for bounce messages)
        domain_id:
          type: string
          format: uuid
          description: Domain ID this message was sent from
        account_id:
          type: string
          format: uuid
          description: Account ID this message belongs to
      required:
      - object
      - created_at
      - updated_at
      - sent_at
      - delivered_at
      - retain_until
      - direction
      - is_bounce_notification
      - bounce_classification
      - delivery_attempts
      - message_id
      - id
      - subject
      - tags
      - sender
      - recipient
      - status
      - num_attempts
      - click_count
      - open_count
      - reference_message_id
      - domain_id
      - account_id
    PaginationInfo:
      type: object
      required:
      - has_more
      properties:
        has_more:
          type: boolean
          description: Whether more items exist after the last item of this page
        next_cursor:
          type: string
          description: Pass as `after` to fetch the next page
        previous_cursor:
          type: string
          description: Pass as `before` to fetch the previous page; absent on a `before` page when the start of the list has been reached
      example:
        has_more: true
        next_cursor: eyJpZCI6MTIzNH0=
    MessageSchedule:
      type: object
      properties:
        first_attempt:
          type: string
          format: date-time
          description: The time to make the first attempt for delivering the message. Must be RFC3339 format, in the future, and within 7 days of the request.
        expires:
          type: string
          format: date-time
          description: Expire and drop the message if not delivered by this time. Must be RFC3339 format, in the future, and within 8 days of the request.
    Tracking:
      type:
      - object
      - 'null'
      properties:
        open:
          type:
          - boolean
          - 'null'
          description: Whether to track opens
        click:
          type:
          - boolean
          - 'null'
          description: Whether to track clicks
      example:
        open: true
        click: true
    Retention:
      type:
      - object
      - 'null'
      properties:
        metadata:
          type:
          - integer
          - 'null'
          description: Number of days to retain metadata
          minimum: 1
          maximum: 30
        data:
          type:
          - integer
          - 'null'
          description: Number of days to retain data
          minimum: 0
          maximum: 30
      example:
        metadata: 1
        data: 0
    MessageAttachment:
      type: object
      properties:
        filename:
          type: string
          description: Original filename of the attachment
          example: document.pdf
        content:
          type: string
          description: Base64 encoded attachment content
        content_type:
          type: string
          description: MIME content type of the attachment
          example: application/pdf
        content_id:
          type: string
          description: Content-ID for inline attachments
          example: image001@example.com
      required:
      - filename
      - content
      - content_type
      - content_id
    CreateMessageResponse:
      type: object
      required:
      - object
      - data
      properties:
        object:
          type: string
          enum:
          - list
          description: Object type identifier
        data:
          type: array
          items:
            $ref: '#/components/schemas/CreateSingleMessageResponse'
          description: List of messages and their statuses
    Address:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
          description: Valid email address from a domain defined in your account with valid DNS records
        name:
          type: string
          description: Display name for the sender
      example:
        email: noreply@example.com
        name: Example Corp
    SuccessResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          description: Success message
      example:
        message: Operation completed successfully
    CreateSingleMessageResponse:
      type: object
      required:
      - object
      - id
      - recipient
      - status
      - error
      properties:
        object:
          type: string
          enum:
          - message
          description: Object type identifier
        id:
          type:
          - string
          - 'null'
          description: Message ID (null if the message was not sent)
          example: <uuid@example.com>
        recipient:
          allOf:
          - $ref: '#/components/schemas/Recipient'
          - type: object
            required:
            - name
        status:
          type: string
          enum:
          - queued
          - scheduled
          - error
          description: Status of the message
        error:
          type:
          - string
          - 'null'
          description: Error message if the message was not sent
        schedule:
          $ref: '#/components/schemas/MessageSchedule'
          description: Provided if the request contained a schedule
    CreateMessageRequest:
      type: object
      required:
      - from
      - recipients
      - subject
      properties:
        from:
          $ref: '#/components/schemas/Address'
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/Recipient'
          minItems: 1
          maxItems: 100
          description: This does not set the To header to multiple addresses, it sends a separate message for each recipient
        reply_to:
          $ref: '#/components/schemas/Address'
          description: If provided, the reply-to header in headers array must not be provided
        subject:
          type: string
          description: Email subject line
        text_content:
          type: string
          description: Plain text content. Required if html_content is empty
        html_content:
          type: string
          description: HTML content. Required if text_content is empty
        amp_content:
          type: string
          description: AMP HTML content
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          description: File attachments. For inline images, set the attachment's `content_id` to a value wrapped in angle brackets (e.g. `<image1@example.com>`) and reference it from `html_content` with `cid:` (e.g. `<img src="cid:image1@example.com">`).
        headers:
          type: object
          additionalProperties:
            type: string
          description: Custom email headers. reply-to header cannot be provided if reply_to is provided, message-id will be ignored and automatically generated
        substitutions:
          type: object
          additionalProperties: true
          description: Global substitutions, recipient substitutions override global
        tags:
          type: array
          items:
            type: string
          description: Tags for categorizing messages
        sandbox:
          type: boolean
          description: If true, the message will be sent to the sandbox environment
          default: false
        sandbox_result:
          type: string
          enum:
          - deliver
          - bounce
          - defer
          - fail
          - suppress
          description: The result of the sandbox send
        tracking:
          $ref: '#/components/schemas/Tracking'
          description: Tracking settings for the message, overrides default account settings
        retention:
          $ref: '#/components/schemas/Retention'
          description: Retention settings for the message, overrides default account settings
        schedule:
          $ref: '#/components/schemas/MessageSchedule'
          description: Schedule for message delivery
      example:
        from:
          email: noreply@example.com
          name: Example Corp
        recipients:
        - email: user@example.com
          name: John Doe
        subject: Welcome to Example Corp
        html_content: <h1>Welcome {{first_name}}!</h1>
        text_content: Welcome {{first_name}}!
        substitutions:
          first_name: John
    Recipient:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
          description: Recipient email address
        name:
          type: string
          description: Display name for the recipient
        substitutions:
          type: object
          additionalProperties: true
          description: Substitution data for the recipient. Used with jinja2 templating language for dynamic content
      example:
        email: user@example.com
        name: John Doe
        substitutions:
          first_name: John
          order_id: '12345'
    DeliveryEvent:
      type: object
      properties:
        time:
          type: string
          format: date-time
          description: Timestamp of the delivery event
        log:
          type: string
          description: Log message for the delivery event
        status:
          type: string
          description: Status of the delivery event
      required:
      - time
      - log
      - status
    ErrorResponse:
      type: object
      description: 'Human-readable API error. The server currently sends no stable machine

        error code. In particular, clients must not parse `message` to

        distinguish IP-allow-list, scope, ownership, plan, self-lockout,

        suppression-duplicate, or other errors that share an HTTP status.

        '
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
          description: Error description
      example:
        message: Error message
    PaginatedMessagesResponse:
      type: object
      required:
      - object
      - data
      - pagination
      properties:
        object:
          type: string
          enum:
          - list
          description: Object type identifier
        data:
          type: array
          items:
            $ref: '#/components/schemas/MessageSummary'
          description: Array of message summaries (content and content_parsed fields omitted for performance)
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    MessageContentPart:
      type: object
      properties:
        content_type:
          type: string
          description: MIME content type (e.g., "text/plain", "text/html")
          example: text/html
        content:
          type: string
          description: The actual content for this part
      required:
      - content_type
      - content
    Message:
      allOf:
      - $ref: '#/components/schemas/MessageSummary'
      - type: object
        properties:
          content:
            type: string
            description: Original raw email content in RFC822 format. Omitted when message content is unavailable.
          content_parsed:
            $ref: '#/components/schemas/MessageContentParsed'
            description: Parsed message content. Omitted when message content is unavailable.
    MessageContentParsed:
      type: object
      properties:
        parts:
          type: array
          items:
            $ref: '#/components/schemas/MessageContentPart'
          description: Array of message content parts (text, HTML, etc.)
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/MessageAttachment'
          description: Array of message attachments
        headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Email headers as key-value pairs (values are arrays to handle multiple headers with same name)
          example:
            Content-Type:
            - text/html; charset=utf-8
            X-Custom-Header:
            - value1
            - value2
      required:
      - parts
      - attachments
      - headers
    CreateConversationMessageRequest:
      type: object
      required:
      - from
      - to
      - subject
      properties:
        from:
          $ref: '#/components/schemas/Address'
        to:
          type: array
          items:
            $ref: '#/components/schemas/Address'
          minItems: 1
          maxItems: 50
          description: This parameter can set the `To` header to multiple addresses. The combined to, cc, and bcc recipient count must not exceed 50.
        cc:
          type: array
          items:
            $ref: '#/components/schemas/Address'
          minItems: 1
          maxItems: 50
          description: This parameter can set the `CC` header to multiple addresses. Do not include `cc` in the headers array. The combined to, cc, and bcc recipient count must not exceed 50.
        bcc:
          type: array
          items:
            $ref: '#/components/schemas/Address'
          minItems: 1
          maxItems: 50
          description: This parameter can set the `To` header to multiple addresses. The combined to, cc, and bcc recipient count must not exceed 50.
        reply_to:
          $ref: '#/components/schemas/Address'
          description: If provided, the reply-to header in headers array must not be provided
        subject:
          type: string
          description: Email subject line
        text_content:
          type: string
          description: Plain text content. Required if html_content is empty
        html_content:
          type: string
          description: HTML content. Required if text_content is empty
        amp_content:
          type: string
          description: AMP HTML content
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          description: File attachments. For inline images, set the attachment's `content_id` to a value wrapped in angle brackets (e.g. `<image1@example.com>`) and reference it from `html_content` with `cid:` (e.g. `<img src="cid:image1@example.com">`).
        headers:
          type: object
          additionalProperties:
            type: string
          description: Custom email headers. `cc` and `reply-to` headers cannot be provided if `reply_to` or `cc` parameters are provided, message-id will be ignored and automatically generated
        tags:
          type: array
          items:
            type: string
          description: Tags for categorizing messages
        sandbox:
          type: boolean
          description: If true, the message will be sent to the sandbox environment
          default: false
        sandbox_result:
          type: string
          enum:
          - deliver
          - bounce
          - defer
          - fail
          - suppress
          description: The result of the sandbox send
        tracking:
          $ref: '#/components/schemas/Tracking'
          description: Tracking settings for the message, overrides default account settings
        retention:
          $ref: '#/components/schemas/Retention'
          description: Retention settings for the message, overrides default account settings
        schedule:
          $ref: '#/components/schemas/MessageSchedule'
          description: Schedule for message delivery
      example:
        from:
          email: noreply@example.com
          name: Example Corp
        to:
        - email: user@example.com
          name: John Doe
        - email: someone@example.com
          name: Jane Doe
        cc:
        - email: hr@example.com
          name: Example Corp HR
        bcc:
        - email: bcc@example.com
          name: BCC Recipient
        subject: Welcome to Example Corp
        html_content: <h1>Dear John and Jane, welcome to Example Corp!</h1>
        text_content: Dear John and Jane, welcome to Example Corp!
    Attachment:
      type: object
      required:
      - data
      - content_type
      - file_name
      properties:
        base64:
          type: boolean
          description: If true, data must be encoded using base64. Otherwise, data will be interpreted as UTF-8
          default: false
        data:
          type: string
          description: Either plaintext or base64 encoded attachment data (depending on base64 field)
        content_type:
          type: string
          description: The MIME type of the attachment
        content_disposition:
          type: string
          description: The disposition of the attachment
        content_id:
          type: string
          description: 'Content-ID that lets you reference this attachment as an inline image from your HTML.


            The value **must be wrapped in angle brackets**, matching the MIME `Content-ID` header format — for example `"<image1@example.com>"`. Reference it from `html_content` **without** the brackets, e.g. `<img src="cid:image1@example.com">`.


            If the angle brackets are omitted, the file is delivered as a regular (downloadable) attachment instead of rendering inline.

            '
        file_name:
          type: string
          description: The filename of the attachment
      example:
        base64: true
        data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==
        content_type: image/png
        file_name: pixel.png
  headers:
    IdempotencyInProgress:
      description: 'Identifies an idempotency-key execution that is still in progress. This

        header is emitted only on the specialized HTTP 409 response.

        '
      schema:
        type: string
        enum:
        - 'false'
    IdempotencyRetryAfter:
      description: 'Positive whole number of seconds after which the in-progress execution

        lease may be retried with the same key and unchanged request.

        '
      schema:
        type: integer
        minimum: 1
    IdempotentReplayed:
      description: 'Indicates that this response is a stored replay of a previous identical request.

        When this header is absent, the response is not a stored replay. Ordinary fresh

        responses do not send `false`; that value is reserved for an in-progress 409.

        '
      schema:
        type: string
        enum:
        - 'true'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Optional idempotency key for safe request retries. Must be a unique string for each logical request.

        An identical request with a completed stored outcome returns the original status and body. An in-progress

        execution returns 409, a changed method/path/body returns 422, and a released 5xx execution may run again.

        Keys for non-secret responses expire after 24 hours. API-key create responses include a one-time `secret_key`,

        so successful encrypted replay responses for those operations expire after 5 minutes.

        '
      schema:
        type: string
        maxLength: 255
      example: user-12345-create-domain-20240101
  responses:
    IdempotencyPayloadMismatch:
      description: 'Idempotency key was already used with a different HTTP method, resolved

        request path, or request body. This response includes neither

        `Idempotent-Replayed` nor `Retry-After`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: idempotency key was already used with a different request payload
    IdempotencyConflict:
      description: 'Request in progress. This response always includes

        `Idempotent-Replayed: false` and a positive integer `Retry-After`.

        Clients must use that header tuple, not the human-readable message, to

        distinguish this retryable idempotency state from other HTTP 409s.

        '
      headers:
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotencyInProgress'
        Retry-After:
          $ref: '#/components/headers/IdempotencyRetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: A request with this idempotency key is already in progress
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: aha-sk-64-CHARACTER-RANDOM-STRING
      description: 'API key for authentication. Non-empty Security Requirement values are

        AhaSend API-key roles. Roles listed within one requirement object are

        jointly required; separate requirement objects are alternatives.

        '
