components:
  responses:
    IdempotencyConflict:
      description: 'Request in progress. This response always includes

        `Idempotent-Replayed: false` and a positive integer `Retry-After`.

        Clients must use that header tuple, not the human-readable message, to

        distinguish this retryable idempotency state from other HTTP 409s.

        '
      headers:
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotencyInProgress'
        Retry-After:
          $ref: '#/components/headers/IdempotencyRetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: A request with this idempotency key is already in progress
    IdempotencyPayloadMismatch:
      description: 'Idempotency key was already used with a different HTTP method, resolved

        request path, or request body. This response includes neither

        `Idempotent-Replayed` nor `Retry-After`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: idempotency key was already used with a different request payload
    TemplateCheckBusy:
      description: 'Every message is checked with the template engine before it is sent,

        and the check could not run right now: the service was busy, or the

        engine failed. Nothing was sent and nothing is known to be wrong with

        the message.

        Send it again after `Retry-After` seconds; on an operation that takes

        an `Idempotency-Key`, send it with the same key.

        '
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: the message could not be checked right now; try again in a moment
  schemas:
    PaginationInfo:
      type: object
      required:
      - has_more
      properties:
        has_more:
          type: boolean
          description: Whether more items exist after the last item of this page
        next_cursor:
          type: string
          description: Pass as `after` to fetch the next page
        previous_cursor:
          type: string
          description: Pass as `before` to fetch the previous page; absent on a `before` page when the start of the list has been reached
      example:
        has_more: true
        next_cursor: eyJpZCI6MTIzNH0=
    Recipient:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
          description: Recipient email address
        name:
          type: string
          description: Display name for the recipient. It can hold any Unicode text; the API encodes it for the header. On a send with substitutions or a template, a name with non-ASCII text can use `{{ name }}` references only; other template syntax in it is refused.
        substitutions:
          type: object
          additionalProperties: true
          description: Substitution data for the recipient. Used with jinja2 templating language for dynamic content. In the HTML and AMP bodies, values are HTML-escaped; write `{{ name|safe }}` to insert a value as HTML. The subject, the headers and the text body get values as they are. On a template send, to fill a `list` variable, send an array; the template's `variables` show the fields each element needs.
      example:
        email: user@example.com
        name: John Doe
        substitutions:
          first_name: John
          order_id: '12345'
    CreateTemplateMessageRequest:
      type: object
      required:
      - template_id
      - recipients
      properties:
        template_id:
          type: string
          format: uuid
          description: The ID of one of this account's transactional templates. List Templates returns the IDs.
        from:
          $ref: '#/components/schemas/Address'
          description: The sender. Leave it out to send from the template's default sender. A `from` given here is used even when the template has a default sender, and it must have an `email`.
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/Recipient'
          minItems: 1
          maxItems: 100
          description: 'Each recipient gets a separate message. This does not set the To header to more than one address.


            A recipient''s `substitutions` hold its values for the template''s variables. They are the only place for these values. To fill a `list` variable, send an array; the template''s `variables` show the fields each element needs.

            '
        reply_to:
          $ref: '#/components/schemas/Address'
          description: If provided, the reply-to header in headers must not be provided. When the request has neither, the template's reply-to is used.
        subject:
          type: string
          description: 'Email subject line. When it is left out, empty or only spaces, the template''s published subject is used.


            A `{{ variable }}` in the subject, yours or the template''s, resolves for every recipient from that recipient''s `substitutions` and the reserved variables, whatever else the subject contains -- an emoji or an accented character included. A variable with no value becomes empty.


            Pad the braces with ordinary spaces: a variable written with non-ASCII whitespace inside them is not reliably recognised.


            On a subject that carries a `{{ variable }}` and an emoji or an accented character, template syntax other than a variable -- `{% ... %}`, `{# ... #}` or an unclosed brace -- is rejected. A substitution value is rejected for any of `{{`, `{%` or `{#`, a `{{ ... }}` included, and so is a subject whose values combine into one of them.

            '
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          description: File attachments. For an inline image, set the attachment's `content_id` to a value wrapped in angle brackets (e.g. `<image1@example.com>`). The template's HTML can then show it with `cid:` (e.g. `<img src="cid:image1@example.com">`).
        headers:
          type: object
          additionalProperties:
            type: string
          description: 'Custom email headers. Each name must be visible ASCII with no space and no colon. reply-to header cannot be provided if reply_to is provided, message-id will be ignored and automatically generated.


            A `{{ variable }}` in a value resolves from the recipient''s `substitutions` and the reserved variables. On a template whose design uses `unsubscribe_url`, a `List-Unsubscribe` or `List-Unsubscribe-Post` header given here is dropped.

            '
        tags:
          type: array
          items:
            type: string
          description: Tags for categorizing messages
        sandbox:
          type: boolean
          description: If true, the message will be sent to the sandbox environment
          default: false
        sandbox_result:
          type: string
          enum:
          - deliver
          - bounce
          - defer
          - fail
          - suppress
          description: The result of the sandbox send
        tracking:
          $ref: '#/components/schemas/Tracking'
          description: Tracking settings for the message, overrides default account settings
        retention:
          $ref: '#/components/schemas/Retention'
          description: Retention settings for the message, overrides default account settings
        schedule:
          $ref: '#/components/schemas/MessageSchedule'
          description: Schedule for message delivery
      example:
        template_id: 0195c2a4-7d3e-7b6a-9f1c-2e4d5a6b7c8d
        recipients:
        - email: user@example.com
          name: John Doe
          substitutions:
            first_name: John
            order_id: '12345'
    MessageSchedule:
      type: object
      properties:
        first_attempt:
          type: string
          format: date-time
          description: The time to make the first attempt for delivering the message. Must be RFC3339 format, in the future, and within 7 days of the request.
        expires:
          type: string
          format: date-time
          description: Expire and drop the message if not delivered by this time. Must be RFC3339 format, in the future, and within 8 days of the request.
    PaginatedMessagesResponse:
      type: object
      required:
      - object
      - data
      - pagination
      properties:
        object:
          type: string
          enum:
          - list
          description: Object type identifier
        data:
          type: array
          items:
            $ref: '#/components/schemas/MessageSummary'
          description: Array of message summaries (content and content_parsed fields omitted for performance)
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    Retention:
      type:
      - object
      - 'null'
      properties:
        metadata:
          type:
          - integer
          - 'null'
          description: Number of days to retain metadata
          minimum: 1
          maximum: 30
        data:
          type:
          - integer
          - 'null'
          description: Number of days to retain data
          minimum: 0
          maximum: 30
      example:
        metadata: 1
        data: 0
    Tracking:
      type:
      - object
      - 'null'
      properties:
        open:
          type:
          - boolean
          - 'null'
          description: Whether to track opens
        click:
          type:
          - boolean
          - 'null'
          description: Whether to track clicks
      example:
        open: true
        click: true
    MessageSummary:
      type: object
      properties:
        object:
          type: string
          enum:
          - message
          description: Object type identifier
        created_at:
          type: string
          format: date-time
          description: When the message was created
        updated_at:
          type: string
          format: date-time
          description: When the message was last updated
        sent_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the message was sent
        delivered_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the message was delivered
        retain_until:
          type: string
          format: date-time
          description: When the message data will be purged
        direction:
          type: string
          enum:
          - inbound
          - outbound
          description: Message direction
        is_bounce_notification:
          type: boolean
          description: Whether this is a bounce notification
        bounce_classification:
          type: string
          description: Classification of bounce if applicable
        delivery_attempts:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryEvent'
          description: List of delivery attempts for this message
        message_id:
          type: string
          description: Message-ID header value
        id:
          type:
          - string
          - 'null'
          format: uuid
          description: API-generated message ID
        subject:
          type: string
          description: Message subject
        tags:
          type: array
          items:
            type: string
          description: Tags associated with the message
        sender:
          type: string
          format: email
          description: Sender email address
        recipient:
          type: string
          format: email
          description: Recipient email address
        status:
          type: string
          description: Current message status
        num_attempts:
          type: integer
          description: Number of delivery attempts
        click_count:
          type: integer
          description: Number of clicks tracked for this message
        open_count:
          type: integer
          description: Number of opens tracked for this message
        reference_message_id:
          type:
          - integer
          - 'null'
          format: int64
          description: ID of the original message (for bounce messages)
        domain_id:
          type: string
          format: uuid
          description: Domain ID this message was sent from
        account_id:
          type: string
          format: uuid
          description: Account ID this message belongs to
        template_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The transactional template the message was sent from with [Create Template Message](https://ahasend.com/docs/api-reference/messages/create-template-message). Null for any other message, including SMTP mail, dashboard test sends and messages sent before this field was added. The template may have been deleted since.
      required:
      - object
      - created_at
      - updated_at
      - sent_at
      - delivered_at
      - retain_until
      - direction
      - is_bounce_notification
      - bounce_classification
      - delivery_attempts
      - message_id
      - id
      - subject
      - tags
      - sender
      - recipient
      - status
      - num_attempts
      - click_count
      - open_count
      - reference_message_id
      - domain_id
      - account_id
      - template_id
    CreateMessageResponse:
      type: object
      required:
      - object
      - data
      properties:
        object:
          type: string
          enum:
          - list
          description: Object type identifier
        data:
          type: array
          items:
            $ref: '#/components/schemas/CreateSingleMessageResponse'
          description: List of messages and their statuses
    Message:
      allOf:
      - $ref: '#/components/schemas/MessageSummary'
      - type: object
        properties:
          content:
            type: string
            description: Original raw email content in RFC822 format. Omitted when message content is unavailable.
          content_parsed:
            $ref: '#/components/schemas/MessageContentParsed'
            description: Parsed message content. Omitted when message content is unavailable.
    CreateMessageRequest:
      type: object
      required:
      - from
      - recipients
      - subject
      properties:
        from:
          $ref: '#/components/schemas/Address'
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/Recipient'
          minItems: 1
          maxItems: 100
          description: This does not set the To header to multiple addresses, it sends a separate message for each recipient
        reply_to:
          $ref: '#/components/schemas/Address'
          description: If provided, the reply-to header in headers array must not be provided
        subject:
          type: string
          description: 'Email subject line.


            A `{{ variable }}` in a subject resolves, whatever else the subject contains -- an emoji or an accented character included -- for every recipient whose message carries substitutions, the request''s own `substitutions` or that recipient''s. A recipient with neither is sent nothing to render, so their subject arrives exactly as written, braces and all.


            Pad the braces with ordinary spaces: a variable written with non-ASCII whitespace inside them is not reliably recognised.


            On a subject that is being resolved and carries an emoji or an accented character, template syntax other than a variable -- `{% ... %}`, `{# ... #}` or an unclosed brace -- is rejected. A substitution value is rejected for any of `{{`, `{%` or `{#`, a `{{ ... }}` included, and so is a subject whose values combine into one of them.

            '
        text_content:
          type: string
          description: Plain text content. Required if html_content is empty
        html_content:
          type: string
          description: HTML content. Required if text_content is empty
        amp_content:
          type: string
          description: AMP HTML content
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
