openapi: 3.2.0
info:
  title: AhaSend API v2 Templates API
  description: 'The AhaSend API v2 allows you to send transactional emails, manage domains, webhooks, routes, API keys, and view statistics. ## Authentication

    All API requests must be authenticated using a Bearer token in the Authorization header:

    ```

    Authorization: Bearer aha-sk-64-CHARACTER-RANDOM-STRING

    ```


    ## Scopes

    API keys have specific scopes that control access to different resources and actions:


    ### Message Scopes

    - `messages:send:all` - Send messages from any domain in the account

    - `messages:send:{domain}` - Send messages from a specific domain

    - `messages:cancel:all` - Cancel messages from any domain

    - `messages:cancel:{domain}` - Cancel messages from a specific domain

    - `messages:read:all` - Read messages from any domain

    - `messages:read:{domain}` - Read messages from a specific domain


    ### Domain Scopes

    - `domains:read` - Read all domains

    - `domains:write` - Create and update domains

    - `domains:delete:all` - Delete any domain

    - `domains:delete:{domain}` - Delete a specific domain


    ### Account Scopes

    - `accounts:read` - Read account information

    - `accounts:write` - Update account settings

    - `accounts:billing` - Access billing information

    - `accounts:members:read` - Read account members

    - `accounts:members:add` - Add account members

    - `accounts:members:update` - Update account members

    - `accounts:members:remove` - Remove account members


    ### Webhook Scopes

    - `webhooks:read:all` - Read all webhooks

    - `webhooks:read:{domain}` - Read webhooks for a specific domain

    - `webhooks:write:all` - Create and update webhooks

    - `webhooks:write:{domain}` - Create and update webhooks for a specific domain

    - `webhooks:delete:all` - Delete any webhook

    - `webhooks:delete:{domain}` - Delete webhooks for a specific domain


    ### Route Scopes

    - `routes:read:all` - Read all routes

    - `routes:read:{domain}` - Read routes for a specific domain

    - `routes:write:all` - Create and update routes

    - `routes:write:{domain}` - Create and update routes for a specific domain

    - `routes:delete:all` - Delete any route

    - `routes:delete:{domain}` - Delete routes for a specific domain


    ### Suppression Scopes

    - `suppressions:read` - Read suppressions

    - `suppressions:write` - Create suppressions

    - `suppressions:delete` - Delete suppressions

    - `suppressions:wipe` - Delete the account''s suppressions except protected ones (dangerous)


    ### Template Scopes

    - `templates:read` - Read transactional templates, their drafts and their published versions, and campaign templates

    - `templates:write` - Create and update transactional templates, and publish, discard and restore their drafts; create and update campaign templates

    - `templates:delete` - Delete transactional templates and campaign templates


    ### Campaign Scopes

    - `campaigns:read` - Read campaigns, their stats and their recipients

    - `campaigns:write` - Create, update and duplicate campaigns

    - `campaigns:delete` - Delete draft campaigns

    - `campaigns:send` - Send, unschedule and test-send campaigns


    ### Contact Scopes

    - `contacts:read` - Read contacts

    - `contacts:write` - Create and update contacts

    - `contacts:delete` - Delete contacts


    ### Contact lifecycle and attributes

    Contacts are account-global. A contact created through this API joins no

    list on its own; campaigns target lists, so add it to one with the Lists

    endpoints before a campaign can reach it. Contact subscription state and suppression records are independent:

    creating, updating, unsubscribing, resubscribing, or deleting a contact

    never creates, changes, or removes complaint, permanent, or protected

    suppressions. Prefer unsubscribe over delete when the goal is only to stop

    marketing mail, because unsubscribe is reversible and preserves contact

    history. Writable attribute keys and types come from the account''s contact-attribute

    definitions managed in the dashboard; this API does not expose property

    definition CRUD.'
  version: 2.0.0
  contact:
    email: support@ahasend.com
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://api.ahasend.com
  description: Production server
security:
- BearerAuth: []
tags:
- name: Templates
  description: Create, change, publish and delete the account's transactional templates, and read them with their drafts, their published versions and the variables a send must supply
paths:
  /v2/accounts/{account_id}/templates:
    get:
      summary: List Templates
      description: 'Returns a cursor-paginated list of the account''s transactional

        templates, newest first. Campaign designs are a different resource and

        never appear here. Each template is listed without its `content`; Get

        Template returns it.


        A template with no design yet is listed like any other; whether it can

        be sent is the send''s answer, not this one.'
      operationId: listTemplates
      tags:
      - Templates
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: Maximum number of items to return (1-100)
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: after
        in: query
        description: Pagination cursor for the next page. Provide the value from `next_cursor` in the response.
        schema:
          type: string
      - name: before
        in: query
        description: Pagination cursor for the previous page. Provide the value from `previous_cursor` in the response.
        schema:
          type: string
      security:
      - BearerAuth:
        - templates:read
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  response, _, err := client.TemplatesAPI.GetTemplates(ctx, accountID, requests.GetTemplatesParams{\n    Limit: ahasend.Int32(100),\n  })\n  if err != nil {\n    log.Fatalf(\"Error listing templates: %v\", err)\n  }\n  for _, template := range response.Data {\n    fmt.Printf(\"%s %s\\n\", template.ID, template.Name)\n  }\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: 'import { AhaSendClient } from "@ahasend/sdk";


          const client = AhaSendClient.fromEnv();

          const page = await client.templates.list({ limit: 20 });

          console.log("Templates listed.", { count: page.data.length });

          '
      responses:
        '200':
          description: Paginated templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTemplatesResponse'
        '400':
          description: Invalid limit or cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing `templates:read` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create Template
      description: 'Creates a transactional template. Its fields go to its draft, as a

        dashboard save does, so sends keep failing until it is published: pass

        `publish: true` to publish it in the same request, or call Publish

        Template.


        `content.mjml` makes an `advanced` template and `content.html` an `html`

        template. A template with neither must name its `editor`. The editor never

        changes after create.


        MJML is compiled in strict mode, and HTML must use full `https://` URLs

        for its images and stylesheets: the API cannot upload files.


        A create with `publish: true` and nothing to publish is refused and

        creates nothing.'
      operationId: createTemplate
      tags:
      - Templates
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - BearerAuth:
        - templates:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
      responses:
        '201':
          description: Template created. The Template object is the published copy; `has_draft` says whether the request left a draft.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          description: 'Invalid request: the body, a field, or a publish with nothing to publish. The message names the field and the problem.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing `templates:write` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/IdempotencyPayloadMismatch'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/common\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  // HTML content makes an html template; MJML would make an advanced one.\n  // The text is made from the HTML when it is left out. Publish makes the\n  // template ready to send at once; without it, the fields stay in a draft.\n  response, _, err := client.TemplatesAPI.CreateTemplate(ctx, accountID, requests.CreateTemplateRequest{\n    Name:    \"Password reset\",\n    Subject: ahasend.String(\"Reset your password, {{ first_name }}\"),\n    From: &common.SenderAddress{\n      Email: \"hello@yourdomain.com\",\n      Name:  ahasend.String(\"Example\"),\n    },\n    Content: &requests.TemplateContentInput{\n      HTML: ahasend.String(`<p>Hi {{ first_name }},</p><p><a href=\"{{ reset_url }}\">Reset your password</a></p>`),\n    },\n    Publish: true,\n  })\n  if err != nil {\n    log.Fatalf(\"Error creating template: %v\", err)\n  }\n  fmt.Printf(\"Created %s template %s\\n\", response.Editor, response.ID)\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: "import { AhaSendClient } from \"@ahasend/sdk\";\n\nconst client = AhaSendClient.fromEnv();\n// The SDK sends a fresh Idempotency-Key automatically and reuses it on its own retries.\nconst template = await client.templates.create({\n  name: \"Welcome email\",\n  subject: \"Welcome, {{ first_name }}\",\n  content: { html: \"<p>Hello {{ first_name }}, welcome aboard.</p>\" },\n  publish: true,\n});\nconsole.log(\"Template created.\", { id: template.id, editor: template.editor });\n"
  /v2/accounts/{account_id}/templates/{template_id}:
    get:
      summary: Get Template
      description: 'Returns one of the account''s transactional templates: its published

        copy, which is what a send uses, with its content and the variable list

        a send has to satisfy. `has_draft` says whether changes are waiting to

        be published; Get Template Draft returns them. A campaign design''s ID

        is not addressable here and answers 404.'
      operationId: getTemplate
      tags:
      - Templates
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: template_id
        in: path
        required: true
        description: Template ID
        schema:
          type: string
          format: uuid
      security:
      - BearerAuth:
        - templates:read
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  templateID := uuid.MustParse(\"11111111-1111-4111-8111-111111111111\")\n\n  response, _, err := client.TemplatesAPI.GetTemplate(ctx, accountID, templateID)\n  if err != nil {\n    log.Fatalf(\"Error getting template: %v\", err)\n  }\n  // A send from this template must supply every required variable.\n  for _, variable := range response.Variables {\n    fmt.Printf(\"%s required=%t\\n\", variable.Name, variable.Required)\n  }\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: 'import { AhaSendClient } from "@ahasend/sdk";


          const client = AhaSendClient.fromEnv();

          const templateId = "00000000-0000-4000-8000-000000000009";

          const template = await client.templates.get(templateId);

          console.log("Template found.", { id: template.id, name: template.name });

          '
      responses:
        '200':
          description: Template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          description: Invalid template_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing `templates:read` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update Template
      description: 'Changes a transactional template. Every field but `name` goes to the

        template''s draft, the same draft the dashboard edits, and sends use the

        published copy until the draft is published: pass `publish: true`, or call

        Publish Template. A publish publishes the whole draft, including changes

        made in the dashboard. A draft that ends up equal to the published copy is

        not kept, and a request that changes nothing changes nothing, so the same

        request can be repeated safely.


        `name` is not drafted: it changes when the request succeeds, as its last

        step. A field the request leaves out is neither changed nor checked,

        apart from a custom text kept beside a new design (see

        `TemplateContentInput`).


        When the template changes in the dashboard or through another request

        while this one writes it, the request applies its fields again over the

        new draft. It answers 503 when that keeps happening; retry it.'
      operationId: updateTemplate
      tags:
      - Templates
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: template_id
        in: path
        required: true
        description: Template ID
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - BearerAuth:
        - templates:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTemplateRequest'
      responses:
        '200':
          description: Template updated. The Template object is the published copy; `has_draft` says whether a draft is left.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          description: Invalid template_id, an invalid body or field, a request with no changes, or a publish with nothing to publish or a draft that cannot be rendered. The message names the field and the problem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing `templates:write` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/IdempotencyPayloadMismatch'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/TemplateBeingChanged'
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/common\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  templateID := uuid.MustParse(\"11111111-1111-4111-8111-111111111111\")\n\n  // Only the fields you set change. They go to the template's draft, the\n  // same draft the dashboard edits; Publish publishes the whole draft. An\n  // empty ReplyTo clears the reply-to address.\n  response, _, err := client.TemplatesAPI.UpdateTemplate(ctx, accountID, templateID, requests.UpdateTemplateRequest{\n    Subject: ahasend.String(\"Your password reset link\"),\n    ReplyTo: &common.SenderAddress{},\n    Publish: true,\n  })\n  if err != nil {\n    log.Fatalf(\"Error updating template: %v\", err)\n  }\n  fmt.Printf(\"Updated template %s, has draft: %t\\n\", response.Name, response.HasDraft)\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: "import { AhaSendClient } from \"@ahasend/sdk\";\n\nconst client = AhaSendClient.fromEnv();\n// The SDK sends a fresh Idempotency-Key automatically and reuses it on its own retries.\nconst templateId = \"00000000-0000-4000-8000-000000000009\";\n// Fields go to the template's draft; publish: true also publishes it.\nconst template = await client.templates.update(templateId, {\n  subject: \"Welcome to the team, {{ first_name }}\",\n  preheader: null,\n  publish: true,\n});\nconsole.log(\"Template updated.\", { id: template.id, hasDraft: template.has_draft });\n"
    delete:
      summary: Delete Template
      description: 'Deletes a transactional template, as the dashboard does. Sends of it fail

        from then on, and a second delete answers 404.'
      operationId: deleteTemplate
      tags:
      - Templates
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: template_id
        in: path
        required: true
        description: Template ID
        schema:
          type: string
          format: uuid
      security:
      - BearerAuth:
        - templates:delete
      responses:
        '200':
          description: Template deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid template_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing `templates:delete` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  templateID := uuid.MustParse(\"11111111-1111-4111-8111-111111111111\")\n\n  response, _, err := client.TemplatesAPI.DeleteTemplate(ctx, accountID, templateID)\n  if err != nil {\n    log.Fatalf(\"Error deleting template: %v\", err)\n  }\n  fmt.Println(response.Message)\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: 'import { AhaSendClient } from "@ahasend/sdk";


          const client = AhaSendClient.fromEnv();

          const templateId = "00000000-0000-4000-8000-000000000009";

          const result = await client.templates.delete(templateId);

          console.log("Template deleted.", { message: result.message });

          '
  /v2/accounts/{account_id}/templates/{template_id}/draft:
    get:
      summary: Get Template Draft
      description: 'Returns a template''s draft: the changes saved in the dashboard or

        through the API that are not published yet. Sends use the published

        copy, which Get Template returns, until the draft is published.


        A template with no draft answers 404 `template has no draft`; its

        `has_draft` is false.'
      operationId: getTemplateDraft
      tags:
      - Templates
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
      - name: template_id
        in: path
        required: true
        description: Template ID
        schema:
          type: string
          format: uuid
      security:
      - BearerAuth:
        - templates:read
      responses:
        '200':
          description: Template draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDraft'
        '400':
          description: Invalid template_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing `templates:read` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Template not found (`template not found`), or the template has no draft (`template has no draft`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
