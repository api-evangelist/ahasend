    post:
      summary: Create Sub-Account API Key
      description: 'Creates an API key owned by the sub account. Parent credentials must belong to the parent account and
        include `sub-account-api-keys:write`; sub-account credentials cannot manage nested API keys. The returned `secret_key`
        authenticates as the child account and should be stored immediately.


        Bootstrap example:

        1. Create the sub account with `POST /v2/accounts/{account_id}/sub-accounts` and a unique `Idempotency-Key`.

        2. Create the bootstrap child API key with this endpoint and a different unique `Idempotency-Key`.

        3. Store the one-time `secret_key` from the `201` response. Exact idempotent replays within 5 minutes return the same
        `secret_key`.

        4. Use that child secret with the child `sub_account_id` as the `account_id` on ordinary v2 routes.

        '
      operationId: createSubAccountAPIKey
      tags:
      - Sub Accounts
      parameters:
      - name: account_id
        in: path
        required: true
        description: Parent account ID
        schema:
          type: string
          format: uuid
      - name: sub_account_id
        in: path
        required: true
        description: Sub account ID
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - BearerAuth:
        - sub-account-api-keys:write
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n\n  \"github.com/AhaSend/ahasend-go/api\"\n\
          \  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  // Create\
          \ API client with authentication\n  client := api.NewAPIClient(\n    api.WithAPIKey(\"aha-sk-your-64-character-key\"\
          ),\n  )\n\n  accountID := uuid.New()\n  subAccountID := uuid.New()\n\n  // Create context for the API call\n  ctx\
          \ := context.Background()\n\n  // Bootstrap an API key for the sub-account (idempotency key makes retries safe)\n\
          \  response, httpResp, err := client.SubAccountsAPI.CreateSubAccountAPIKey(\n    ctx,\n    accountID,\n    subAccountID,\n\
          \    requests.CreateAPIKeyRequest{\n      Label:  \"Bootstrap key\",\n      Scopes: []string{\"messages:send:all\"\
          , \"domains:read\"},\n      // Optional: restrict the sub-account key to specific source IPs.\n      IPAllowList:\
          \ []string{\"203.0.113.0/24\"},\n    },\n    api.WithIdempotencyKey(\"child-bootstrap-key-20240101-acme\"),\n  )\n\
          \  if err != nil {\n    log.Fatalf(\"Error creating sub-account API key: %v\", err)\n  }\n\n  if httpResp.StatusCode\
          \ == 201 {\n    fmt.Printf(\"✅ Sub-account API key created. Status: %d\\n\", httpResp.StatusCode)\n    fmt.Printf(\"\
          ID: %s\\n\", response.ID)\n    fmt.Printf(\"Label: %s\\n\", response.Label)\n    fmt.Printf(\"Public key: %s\\n\"\
          , response.PublicKey)\n    // SecretKey is the one-time secret, returned ONLY on create.\n    if response.SecretKey\
          \ != nil {\n      // Store this value immediately — it cannot be retrieved again later.\n      fmt.Printf(\"Secret\
          \ key (store this now, shown only once): %s\\n\", *response.SecretKey)\n    }\n  } else {\n    fmt.Printf(\"❌ Unexpected\
          \ status code: %d\\n\", httpResp.StatusCode)\n  }\n}\n"
      - lang: shell
        label: Bootstrap child API key
        source: "PARENT_ACCOUNT_ID=\"9d0cf9d0-4f5e-4674-bcf1-8ec39968b6e1\"\nPARENT_SECRET=\"aha-sk-parent-64-character-key\"\
          \n\ncurl -sS -X POST \"https://api.ahasend.com/v2/accounts/${PARENT_ACCOUNT_ID}/sub-accounts\" \\\n  -H \"Authorization:\
          \ Bearer ${PARENT_SECRET}\" \\\n  -H \"Content-Type: application/json\" \\\n  -H \"Idempotency-Key: subacct-20240101-acme\"\
          \ \\\n  -d '{\"name\":\"Acme Subsidiary\",\"website\":\"acme.example.com\"}' \\\n  > sub-account.json\n\nCHILD_ACCOUNT_ID=\"\
          $(jq -r '.id' sub-account.json)\"\n\ncurl -sS -X POST \"https://api.ahasend.com/v2/accounts/${PARENT_ACCOUNT_ID}/sub-accounts/${CHILD_ACCOUNT_ID}/api-keys\"\
          \ \\\n  -H \"Authorization: Bearer ${PARENT_SECRET}\" \\\n  -H \"Content-Type: application/json\" \\\n  -H \"Idempotency-Key:\
          \ child-bootstrap-key-20240101-acme\" \\\n  -d '{\"label\":\"Bootstrap key\",\"scopes\":[\"messages:send:all\",\"\
          domains:read\"]}' \\\n  > child-api-key.json\n\nCHILD_SECRET=\"$(jq -r '.secret_key' child-api-key.json)\"\nprintf\
          \ 'Store this one-time child secret securely: %s\\n' \"${CHILD_SECRET}\"\n\ncurl -sS \"https://api.ahasend.com/v2/accounts/${CHILD_ACCOUNT_ID}/domains\"\
          \ \\\n  -H \"Authorization: Bearer ${CHILD_SECRET}\"\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: "import { AhaSendClient } from \"@ahasend/sdk\";\n\nconst client = AhaSendClient.fromEnv();\nconst subAccountId\
          \ = \"00000000-0000-4000-8000-000000000004\";\nconst apiKey = await client.subAccounts.apiKeys.create(\n  subAccountId,\n\
          \  { label: \"Bootstrap key\", scopes: [\"messages:send:all\"] },\n  { idempotencyKey: \"sdk-sample-create-sub-account-api-key\"\
          \ },\n);\nconsole.log(\"Sub-account API key created.\", { id: apiKey.id, label: apiKey.label });\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
            example:
              label: Bootstrap key
              scopes:
              - messages:send:all
              - domains:read
      responses:
        '201':
          description: Sub-account API key created successfully
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIKey'
                - type: object
                  required:
                  - secret_key
                  properties:
                    secret_key:
                      type: string
                      readOnly: true
                      description: 'One-time secret key. Store it immediately. Exact

                        successful idempotent replays return the same secret

                        during the 5-minute encrypted replay window.

                        '
              example:
                object: api_key
                id: 13b3aa8e-78d3-48a1-92d2-4b8b1228c2dd
                created_at: '2024-01-01T00:05:00Z'
                updated_at: '2024-01-01T00:05:00Z'
                last_used_at: null
                account_id: 2f3c5d2a-9ef8-4c91-a5f4-79990c8c1d3a
                label: Bootstrap key
                public_key: aha-pk-child-public-key
                secret_key: aha-sk-child-secret-key
                scopes:
                - id: c574470d-76ef-4f74-9b24-70a583a17e03
                  created_at: '2024-01-01T00:05:00Z'
                  updated_at: '2024-01-01T00:05:00Z'
                  api_key_id: 13b3aa8e-78d3-48a1-92d2-4b8b1228c2dd
                  scope: messages:send:all
                  domain_id: null
                ip_allow_list: []
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Sub account not found under the parent account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/IdempotencyPayloadMismatch'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
