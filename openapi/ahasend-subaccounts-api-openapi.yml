    delete:
      summary: Delete Sub-Account API Key
      description: Deletes an API key owned by a sub account.
      operationId: deleteSubAccountAPIKey
      tags:
      - Subaccounts
      parameters:
      - name: account_id
        in: path
        required: true
        description: Parent account ID
        schema:
          type: string
          format: uuid
      - name: sub_account_id
        in: path
        required: true
        description: Sub account ID
        schema:
          type: string
          format: uuid
      - name: key_id
        in: path
        required: true
        description: API key ID
        schema:
          type: string
          format: uuid
      security:
      - BearerAuth:
        - sub-account-api-keys:delete
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  subAccountID := uuid.MustParse(\"7d3c9f5e-2a41-4b8e-9c6d-0f1e2a3b4c5d\")\n  keyID := uuid.MustParse(\"c5a32c40-b351-439f-8230-779daed3e42c\")\n\n  response, _, err := client.SubAccountsAPI.DeleteSubAccountAPIKey(ctx, accountID, subAccountID, keyID)\n  if err != nil {\n    log.Fatalf(\"Error deleting sub-account API key: %v\", err)\n  }\n  fmt.Println(response.Message)\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: 'import { AhaSendClient } from "@ahasend/sdk";


          const client = AhaSendClient.fromEnv();

          const subAccountId = "00000000-0000-4000-8000-000000000004";

          const keyId = "00000000-0000-4000-8000-000000000005";

          const result = await client.subAccounts.apiKeys.delete(subAccountId, keyId);

          console.log("Sub-account API key deleted.", { message: result.message });

          '
      responses:
        '200':
          description: Sub-account API key deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                message: api key {id} ({label}) deleted successfully
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: API key or sub account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CreateAPIKeyRequest:
      type: object
      required:
      - label
      - scopes
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-readable label for the API key; must not be empty
        scopes:
          type: array
          items:
            type: string
          minItems: 1
          description: Array of scope strings to grant to this API key
        ip_allow_list:
          type: array
          items:
            type: string
          description: Optional list of source IPs allowed to authenticate with this key. Each entry is a CIDR block (e.g. `203.0.113.0/24`) or a bare IPv4/IPv6 address (stored as a `/32` or `/128`). Entries are canonicalized (host bits are masked) and de-duplicated. The allow-all prefixes `0.0.0.0/0` and `::/0` are rejected, and at most 100 entries are allowed after de-duplication. Omit the field or pass an empty array to leave the key usable from any IP.
      example:
        label: Production API Key
        scopes:
        - messages:send:all
        - domains:read
        ip_allow_list:
        - 203.0.113.0/24
        - 198.51.100.7
    APIKeyScope:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the scope
        created_at:
          type: string
          format: date-time
          description: When the scope was created
        updated_at:
          type: string
          format: date-time
          description: When the scope was last updated
        api_key_id:
          type: string
          format: uuid
          description: ID of the API key this scope belongs to
        scope:
          type: string
          description: The scope string
        domain_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Domain ID for domain-specific scopes; always present and null for non-domain scopes
      required:
      - id
      - created_at
      - updated_at
      - api_key_id
      - scope
      - domain_id
    PaginatedAPIKeysResponse:
      type: object
      required:
      - object
      - data
      - pagination
      properties:
        object:
          type: string
          enum:
          - list
          description: Object type identifier
        data:
          type: array
          items:
            $ref: '#/components/schemas/APIKey'
          description: Array of API keys
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    UpdateSubAccountRequest:
      type: object
      description: At least one non-null field must be provided, and at least one provided value must differ from the current value. Omitted or null fields are left unchanged.
      anyOf:
      - required:
        - name
        properties:
          name:
            type: string
      - required:
        - website
        properties:
          website:
            type: string
      - required:
        - monthly_credit
        properties:
          monthly_credit:
            type: integer
      properties:
        name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          description: Human-readable name for the sub account; leading and trailing whitespace is trimmed and the result must not be blank
        website:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Account website. A domain such as `acme.com`, or an http(s) URL such as `https://acme.com`, which is reduced to its host before it is stored
        monthly_credit:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
          maximum: 1000000000
          description: Optional monthly cap; 0 means no cap
      example:
        name: Acme Subsidiary
        website: acme.example.com
        monthly_credit: 50000
    Domain:
      type: object
      properties:
        object:
          type: string
          enum:
          - domain
          description: Object type identifier
        id:
          type: string
          format: uuid
          description: Unique identifier for the domain
        created_at:
          type: string
          format: date-time
          description: When the domain was created
        updated_at:
          type: string
          format: date-time
          description: When the domain was last updated
        domain:
          type: string
          description: The domain name
        account_id:
          type: string
          format: uuid
          description: Account ID this domain belongs to
        dns_records:
          type: array
          items:
            $ref: '#/components/schemas/DNSRecord'
          description: DNS records required for domain verification
        last_dns_check_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When DNS records were last checked
        dns_valid:
          type: boolean
          description: Whether all required DNS records are properly configured
        tracking_subdomain:
          type:
          - string
          - 'null'
          description: Custom tracking subdomain. Null means the account or product default is used. Applies to both manual-DNS and managed-DNS domains.
        return_path_subdomain:
          type:
          - string
          - 'null'
          description: Custom return-path subdomain. Null means the account or product default is used. Applies to both manual-DNS and managed-DNS domains.
        subscription_subdomain:
          type:
          - string
          - 'null'
          description: Custom subscription management subdomain. Null means the account or product default is used. Applies to both manual-DNS and managed-DNS domains.
        media_subdomain:
          type:
          - string
          - 'null'
          description: Custom media subdomain. Null means the account or product default is used. Applies to both manual-DNS and managed-DNS domains.
        dkim_rotation_interval_days:
          type:
          - integer
          - 'null'
          description: Custom DKIM rotation interval in days. Null means the account default is used. Only supported for managed DNS domains.
        dkim_selector:
          type:
          - string
          - 'null'
          description: 'Per-domain DKIM selector override. Null means no per-domain override is set.


            This reports the configured per-domain override only, not the effective selector used for DKIM signing. The effective selector is resolved separately and can differ — for example, a selector locked after DNS verification takes precedence over this override.

            '
        rotation_ready:
          type: boolean
          description: Whether the standby DKIM slot is ready for rotation.
        dsn_recipient:
          type:
          - string
          - 'null'
          description: Optional recipient address for delivery status notifications.
        sending_type:
          type: string
          enum:
          - transactional
          - marketing
          description: The type of email that you send from the domain. The sending type affects your deliverability. Marketing email from a transactional domain can get your account paused.
        paused:
          type: boolean
          description: Whether sending from the domain is paused. While the domain is paused, new email from it is refused, and you cannot delete or rename it. Your other domains continue to send.
        paused_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When sending from the domain was paused. Null when the domain is not paused.
        pause_reason:
          type:
          - string
          - 'null'
          description: 'The reason of the pause. Null when the domain is not paused.


            - `bounce_rate`: too many recent emails from the domain bounced.

            '
      required:
      - object
      - id
      - created_at
      - updated_at
      - domain
      - account_id
      - dns_records
      - last_dns_check_at
      - dns_valid
      - tracking_subdomain
      - return_path_subdomain
      - subscription_subdomain
      - media_subdomain
      - dkim_rotation_interval_days
      - dkim_selector
      - rotation_ready
      - dsn_recipient
      - sending_type
      - paused
      - paused_at
      - pause_reason
    PaginationInfo:
      type: object
      required:
      - has_more
      properties:
        has_more:
          type: boolean
          description: Whether more items exist after the last item of this page
        next_cursor:
          type: string
          description: Pass as `after` to fetch the next page
        previous_cursor:
          type: string
          description: Pass as `before` to fetch the previous page; absent on a `before` page when the start of the list has been reached
      example:
        has_more: true
        next_cursor: eyJpZCI6MTIzNH0=
    SuspendSubAccountRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Reason for the pause. When this call starts the pause, the dashboard of the sub account shows it as a note.
      example:
        reason: Customer requested temporary pause
    SubAccount:
      type: object
      required:
      - object
      - id
      - parent_account_id
      - name
      - website
      - status
      - monthly_credit
      - created_at
      - domain_count
      - member_count
      - last_activity_at
      properties:
        object:
          type: string
          enum:
          - sub_account
          description: Object type identifier
        id:
          type: string
          format: uuid
          description: Unique identifier for the sub account
        parent_account_id:
          type: string
          format: uuid
          description: Parent account ID
        created_at:
          type: string
          format: date-time
          description: When the sub account was created
        name:
          type: string
          description: Sub account name
        website:
          type: string
          maxLength: 255
          description: Account website, stored as a bare domain such as `acme.com`
        status:
          type: string
          enum:
          - active
          - suspended
          - parent-suspended
          - deleted
          description: Current sub-account status
        monthly_credit:
          type: integer
          format: int64
          minimum: 0
          description: Optional monthly cap; 0 means no cap
        domain_count:
          type: integer
          format: int64
          minimum: 0
          description: Number of domains owned by the sub account
        member_count:
          type: integer
          format: int64
          minimum: 0
          description: Number of direct members on the sub account
        last_activity_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last recorded sub-account email activity
      example:
        object: sub_account
        id: 2f3c5d2a-9ef8-4c91-a5f4-79990c8c1d3a
        parent_account_id: 9d0cf9d0-4f5e-4674-bcf1-8ec39968b6e1
        name: Acme Subsidiary
        website: acme.example.com
        status: active
        monthly_credit: 0
        created_at: '2024-01-01T00:00:00Z'
        domain_count: 2
        member_count: 3
        last_activity_at: '2024-01-15T12:00:00Z'
    SuccessResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          description: Success message
      example:
        message: Operation completed successfully
    DNSRecord:
      type: object
      properties:
        type:
          type: string
          description: DNS record type (e.g., CNAME, TXT, MX)
        label:
          type: string
          description: Human-readable DNS record label
        host:
          type: string
          description: DNS record host/name
        content:
          type: string
          description: DNS record content/value
        required:
          type: boolean
          description: Whether this DNS record is required for domain verification
        propagated:
          type: boolean
          description: Whether this DNS record has been propagated and verified
      required:
      - type
      - host
      - content
      - required
      - propagated
    APIKey:
      type: object
      properties:
        object:
          type: string
          enum:
          - api_key
          description: Object type identifier
        id:
          type: string
          format: uuid
          description: Unique identifier for the API key
        created_at:
          type: string
          format: date-time
          description: When the API key was created
        updated_at:
          type: string
          format: date-time
          description: When the API key was last updated
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the API key was last used (updates every 5-10 minutes)
        account_id:
          type: string
          format: uuid
          description: Account ID this API key belongs to
        label:
          type: string
          description: Human-readable label for the API key
        public_key:
          type: string
          description: Public portion of the API key
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/APIKeyScope'
          description: Scopes granted to this API key
        ip_allow_list:
          type: array
          items:
            type: string
          description: Source IPs allowed to authenticate with this API key, as canonical CIDR blocks (a bare address is stored as a `/32` for IPv4 or `/128` for IPv6). Always present; an empty array means the key may be used from any source IP. When non-empty, an authenticated request whose client IP is not covered by an entry is rejected with HTTP 403 on every v2 endpoint, regardless of the key's scopes.
      required:
      - object
      - id
      - created_at
      - updated_at
      - last_used_at
      - account_id
      - label
      - public_key
      - scopes
      - ip_allow_list
    SubAccountUsageBreakdown:
      type: object
      required:
      - reception_count
      - allocated_cost
      properties:
        account_id:
          type: string
          format: uuid
          description: Account ID for this usage bucket
        name:
          type: string
          description: Sub account name when this bucket is for a sub account
        reception_count:
          type: integer
          format: int64
          minimum: 0
          description: Number of received messages in the billing period
        allocated_cost:
          type: number
          format: double
          minimum: 0
          description: Proportional allocated cost for this usage bucket
      example:
        account_id: 2f3c5d2a-9ef8-4c91-a5f4-79990c8c1d3a
        name: Acme Subsidiary
        reception_count: 3000000
        allocated_cost: 60.0
    PaginatedSubAccountsResponse:
      type: object
      required:
      - object
      - data
      - pagination
      properties:
        object:
          type: string
          enum:
          - list
          description: Object type identifier
        data:
          type: array
          items:
            $ref: '#/components/schemas/SubAccount'
          description: Array of sub accounts
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    UpdateAPIKeyRequest:
      type: object
      description: At least one non-null field must be provided, and at least one provided value must differ from the current value. Omitted or null fields are left unchanged.
      anyOf:
      - required:
        - label
        properties:
          label:
            type: string
      - required:
        - scopes
        properties:
          scopes:
            type: array
      - required:
        - ip_allow_list
        properties:
          ip_allow_list:
            type: array
      properties:
        label:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          description: Human-readable label for the API key. Omit to keep the existing label.
        scopes:
          type:
          - array
          - 'null'
          items:
            type: string
          minItems: 1
          description: Array of scope strings to grant to this API key
        ip_allow_list:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Replacement list of allowed source IPs (CIDR blocks or bare IPv4/IPv6 addresses; canonicalized and de-duplicated, at most 100 entries, allow-all prefixes `0.0.0.0/0` and `::/0` rejected). Omit the field or send null to leave the existing list unchanged; send an empty array to clear it (key usable from any IP); send a non-empty array to replace it.
      example:
        label: Updated API Key
        scopes:
        - messages:send:{example.com}
        - domains:read
        ip_allow_list:
        - 203.0.113.0/24
    CreateSubAccountRequest:
      type: object
      required:
      - name
      - website
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-readable name for the sub account; leading and trailing whitespace is trimmed and the result must not be blank
        website:
          type: string
          maxLength: 255
          description: Account website. A domain such as `acme.com`, or an http(s) URL such as `https://acme.com`, which is reduced to its host before it is stored
        monthly_credit:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000
          default: 0
          description: Optional monthly cap; 0 means no cap
      example:
        name: Acme Subsidiary
        website: acme.example.com
        monthly_credit: 0
    ErrorResponse:
      type: object
      description: 'Human-readable API error. The server currently sends no stable machine

        error code. In particular, clients must not parse `message` to

        distinguish IP-allow-list, scope, ownership, plan, self-lockout,

        suppression-duplicate, or other errors that share an HTTP status.

        '
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
          description: Error description
      example:
        message: Error message
    SubAccountUsageResponse:
      type: object
      required:
      - billing_period
      - currency
      - allocation_method
      - allocation_note
      - parent
      - sub_accounts
      - removed_sub_accounts
      - total
      properties:
        billing_period:
          type: object
          required:
          - start
          - end
          properties:
            start:
              type: string
              format: date-time
              description: Billing period start
            end:
              type: string
              format: date-time
              description: Billing period end
        currency:
          type: string
          description: Currency code used for cost allocation
        allocation_method:
          type: string
          enum:
          - proportional
          description: Method used to allocate the pooled parent invoice cost
        allocation_note:
          type: string
          description: Disclaimer explaining that allocated cost is not standalone sub-account pricing
        parent:
          allOf:
          - $ref: '#/components/schemas/SubAccountUsageBreakdown'
          - type: object
            required:
            - account_id
        sub_accounts:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/SubAccountUsageBreakdown'
            - type: object
              required:
              - account_id
              - name
          description: Per-sub-account usage and allocated cost
        removed_sub_accounts:
          $ref: '#/components/schemas/SubAccountUsageBreakdown'
          description: Aggregated usage from sub accounts deleted during the period; still billed to the parent and not identified individually
        total:
          $ref: '#/components/schemas/SubAccountUsageBreakdown'
      example:
        billing_period:
          start: '2024-01-01T00:00:00Z'
          end: '2024-02-01T00:00:00Z'
        currency: usd
        allocation_method: proportional
        allocation_note: allocated_cost is a proportional share of the parent's pooled invoice for the period, not what the sub would pay on its own plan.
        parent:
          account_id: 9d0cf9d0-4f5e-4674-bcf1-8ec39968b6e1
          reception_count: 1000000
          allocated_cost: 20.0
        sub_accounts:
        - account_id: 2f3c5d2a-9ef8-4c91-a5f4-79990c8c1d3a
          name: Acme Subsidiary
          reception_count: 3000000
          allocated_cost: 60.0
        removed_sub_accounts:
          reception_count: 0
          allocated_cost: 0.0
        total:
          reception_count: 4000000
          allocated_cost: 80.0
  responses:
    IdempotencyConflict:
      description: 'Request in progress. This response always includes

        `Idempotent-Replayed: false` and a positive integer `Retry-After`.

        Clients must use that header tuple, not the human-readable message, to

        distinguish this retryable idempotency state from other HTTP 409s.

        '
      headers:
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotencyInProgress'
        Retry-After:
          $ref: '#/components/headers/IdempotencyRetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: A request with this idempotency key is already in progress
    IdempotencyPayloadMismatch:
      description: 'Idempotency key was already used with a different HTTP method, resolved

        request path, or request body. This response includes neither

        `Idempotent-Replayed` nor `Retry-After`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: idempotency key was already used with a different request payload
  headers:
    IdempotentReplayed:
      description: 'Indicates that this response is a stored replay of a previous identical request.

        When this header is absent, the response is not a stored replay. Ordinary fresh

        responses do not send `false`; that value is reserved for an in-progress 409.

        '
      schema:
        type: string
        enum:
        - 'true'
    IdempotencyInProgress:
      description: 'Identifies an idempotency-key execution that is still in progress. This

        header is emitted only on the specialized HTTP 409 response.

        '
      schema:
        type: string
        enum:
        - 'false'
    IdempotencyRetryAfter:
      description: 'Positive whole number of seconds after which the in-progress execution

        lease may be retried with the same key and unchanged request.

        '
      schema:
        type: integer
        minimum: 1
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Optional idempotency key for safe request retries. Must be a unique string for each logical request.

        An identical request with a completed stored outcome returns the original status and body. An in-progress

        execution returns 409, a changed method/path/body returns 422, and a released 5xx execution may run again.

        Keys for non-secret responses expire after 24 hours. API-key create responses include a one-time `secret_key`,

        so successful encrypted replay responses for those operations expire after 5 minutes.

        '
      schema:
        type: string
        maxLength: 255
      example: user-12345-create-domain-20240101
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: aha-sk-64-CHARACTER-RANDOM-STRING
      description: 'API key for authentication. Non-empty Security Requirement values are

        AhaSend API-key roles. Roles listed within one requirement object are

        jointly required; separate requirement objects are alternatives.

        '
