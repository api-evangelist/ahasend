        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  subAccountID := uuid.MustParse(\"7d3c9f5e-2a41-4b8e-9c6d-0f1e2a3b4c5d\")\n\n  response, _, err := client.SubAccountsAPI.GetSubAccount(ctx, accountID, subAccountID)\n  if err != nil {\n    log.Fatalf(\"Error getting sub account: %v\", err)\n  }\n  fmt.Printf(\"%s %s (%s)\\n\", response.Name, response.Website, response.Status)\n  fmt.Printf(\"Domains: %d, members: %d\\n\", response.DomainCount, response.MemberCount)\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: 'import { AhaSendClient } from "@ahasend/sdk";


          const client = AhaSendClient.fromEnv();

          const subAccountId = "00000000-0000-4000-8000-000000000004";

          const subAccount = await client.subAccounts.get(subAccountId);

          console.log("Sub-account found.", { id: subAccount.id, status: subAccount.status });

          '
      responses:
        '200':
          description: Sub account details
          content:
            application/json:
