              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update Sub Account
      description: Updates a sub account's editable settings
      operationId: updateSubAccount
      tags:
      - Subaccounts
      parameters:
      - name: account_id
        in: path
        required: true
        description: Parent account ID
        schema:
          type: string
          format: uuid
      - name: sub_account_id
        in: path
        required: true
        description: Sub account ID
        schema:
          type: string
          format: uuid
      security:
      - BearerAuth:
        - sub-accounts:write
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go\"\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  subAccountID := uuid.MustParse(\"7d3c9f5e-2a41-4b8e-9c6d-0f1e2a3b4c5d\")\n\n  response, _, err := client.SubAccountsAPI.UpdateSubAccount(ctx, accountID, subAccountID, requests.UpdateSubAccountRequest{\n    Name:          ahasend.String(\"Acme Subsidiary\"),\n    MonthlyCredit: ahasend.Int64(50000),\n  })\n  if err != nil {\n    log.Fatalf(\"Error updating sub account: %v\", err)\n  }\n  fmt.Printf(\"%s monthly credit: %d\\n\", response.Name, response.MonthlyCredit)\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: "import { AhaSendClient } from \"@ahasend/sdk\";\n\nconst client = AhaSendClient.fromEnv();\nconst subAccountId = \"00000000-0000-4000-8000-000000000004\";\nconst subAccount = await client.subAccounts.update(subAccountId, {\n  name: \"Renamed subsidiary\",\n});\nconsole.log(\"Sub-account updated.\", { id: subAccount.id, status: subAccount.status });\n"
