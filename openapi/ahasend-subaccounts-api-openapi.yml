  /v2/accounts/{account_id}/sub-accounts/{sub_account_id}/suspend:
    post:
      summary: Pause Sub Account
      description: Pauses sending on a sub account under the parent account. The status of the sub account becomes `suspended`.
      operationId: suspendSubAccount
      tags:
      - Subaccounts
      parameters:
      - name: account_id
        in: path
        required: true
        description: Parent account ID
        schema:
          type: string
          format: uuid
      - name: sub_account_id
        in: path
        required: true
        description: Sub account ID
        schema:
          type: string
          format: uuid
      security:
      - BearerAuth:
        - sub-accounts:suspend
      x-code-samples:
      - lang: go
        label: AhaSend Go SDK
        source: "package main\n\nimport (\n  \"context\"\n  \"fmt\"\n  \"log\"\n  \"os\"\n\n  \"github.com/AhaSend/ahasend-go/api\"\n  \"github.com/AhaSend/ahasend-go/models/requests\"\n  \"github.com/google/uuid\"\n)\n\nfunc main() {\n  client := api.NewAPIClient(api.WithAPIKey(os.Getenv(\"AHASEND_API_KEY\")))\n  accountID := uuid.MustParse(os.Getenv(\"AHASEND_ACCOUNT_ID\"))\n  ctx := context.Background()\n\n  subAccountID := uuid.MustParse(\"7d3c9f5e-2a41-4b8e-9c6d-0f1e2a3b4c5d\")\n\n  response, _, err := client.SubAccountsAPI.SuspendSubAccount(ctx, accountID, subAccountID, requests.SuspendSubAccountRequest{\n    Reason: \"Customer requested temporary pause\",\n  })\n  if err != nil {\n    log.Fatalf(\"Error suspending sub account: %v\", err)\n  }\n  fmt.Printf(\"%s is %s\\n\", response.ID, response.Status)\n}\n"
      - lang: javascript
        label: Node.js 22+ (AhaSend SDK)
        source: "import { AhaSendClient } from \"@ahasend/sdk\";\n\nconst client = AhaSendClient.fromEnv();\nconst subAccountId = \"00000000-0000-4000-8000-000000000004\";\nconst subAccount = await client.subAccounts.suspend(subAccountId, {\n  reason: \"Requested by account administrator\",\n});\nconsole.log(\"Sub-account suspended.\", { id: subAccount.id, status: subAccount.status });\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendSubAccountRequest'
      responses:
        '200':
          description: Sub account paused successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubAccount'
        '400':
          description: Bad request
          content:
