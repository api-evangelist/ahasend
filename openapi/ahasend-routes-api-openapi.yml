        delay: 0
        dispatcher: FALLBACK
    post:
      summary: AhaSend Create Route
      description: Creates a new route for inbound email routing
      operationId: createRoute
      tags:
      - Routes
      parameters:
      - name: account_id
        in: path
        required: true
        description: Account ID
        schema:
          type: string
          format: uuid
        example: '500123'
